        }

        function spawnPerson() {
            let attempts = 0;
            const maxX = isMobileLayout ? 500 : 520;
            const maxY = isMobileLayout ? 460 : 480;

            while(attempts < 100) {
                let p = { 
                    x: 40 + Math.random()*maxX, 
                    y: 80 + Math.random()*(maxY - 40), 
                    w: 34, h: 44, 
                    color: getRandomColor('mane'), 
                    type: 'person' 
                };
                let safe = true;
                walls.forEach(w => { if(rectIntersect(p, {x:w.x-20, y:w.y-20, w:w.w+40, h:w.h+40})) safe = false; });
                if (rectIntersect(p, smokingZone)) safe = false;
                desks.forEach(d => { if(rectIntersect(p, {x:d.x-20, y:d.y-20, w:d.w+40, h:d.h+40})) safe = false; });
                if (rectIntersect(p, {x: player.x-50, y: player.y-50, w: 130, h: 140})) safe = false;
                
                if (safe) { desks.push(p); break; }
                attempts++;
            }
        }

        function startGame() {
            getAudioContext();
            setupLayout();
            screens.inst.style.display = 'none';
            
            screens.canvas.style.display = 'block';
            screens.ui.style.display = 'flex';
            
            if (isTouchDevice || isMobileLayout) {
                mobileControls.style.display = 'block';
            }

            const d = DICT[currentLang];
            document.getElementById('score-label').innerText = d[currentChar + '_score'];
            document.getElementById('urge-label').innerText = d[currentChar + '_urge'];
            document.getElementById('action-btn').innerHTML = d[currentChar + '_btn'];

            const chocoHud = document.getElementById('choco-hud');
            if (currentChar === 'jordi') {
                chocoHud.style.display = 'block';
                player.chocolates = 0;
                cookingProgress = 0;
            } else {
                chocoHud.style.display = 'none';
            }

            score = 0; urge = 0; gameOver = false;
            particles = []; floatingTexts = []; shockwaves = []; screenShake = 0;

            if (currentChar === 'kask') {
                player.x = isMobileLayout ? 200 : 250;
                player.y = isMobileLayout ? 520 : 460;
                player.w = 32;
                player.h = 58;
                player.facing = 'up';
                player.speed = 340;
                kaskCars = [];
                kaskRoadOffset = 0;
                kaskSpawnTimer = 0;
            } else {
                player.x = isMobileLayout ? 280 : 300; 
                player.y = isMobileLayout ? 480 : 500;
                player.w = 34;
                player.h = 44;
                player.facing = 'down';
                player.speed = (currentChar === 'lentxo') ? 395 : 285;
            }

            activeDeskIndex = -1; taskDelay = 1.0; itemObj.active = false;
            keys = {}; isActionPressed = false;

            if (currentDiff === 'easy') { urgeSpeed = 2.1; maxTaskTime = 30; timeReduction = 1.0; }
            else if (currentDiff === 'mod') { urgeSpeed = 3.6; maxTaskTime = 20; timeReduction = 1.3; }
            else if (currentDiff === 'ext') { urgeSpeed = 6.0; maxTaskTime = 20; timeReduction = 1.3; }

            if (currentChar === 'alpes') {
                canvas.style.borderColor = "#00f0ff"; document.getElementById('ui').style.borderColor = "#00f0ff";
            } else if (currentChar === 'lentxo') {
                canvas.style.borderColor = "#ff9800"; document.getElementById('ui').style.borderColor = "#ff9800";
            } else if (currentChar === 'mane') {
                canvas.style.borderColor = "#ff00ff"; document.getElementById('ui').style.borderColor = "#ff00ff";
            } else if (currentChar === 'jordi') {
                canvas.style.borderColor = "#d97706"; document.getElementById('ui').style.borderColor = "#d97706";
            } else if (currentChar === 'kask') {
                canvas.style.borderColor = "#e11d48"; document.getElementById('ui').style.borderColor = "#e11d48";
            }

            desks = [];
            if (currentChar === 'mane') {
                for(let i=0; i<6; i++) spawnPerson();
            } else if (currentChar === 'jordi') {
                for (let i = 0; i < 6; i++) {
                    let col = i % 3;
                    let row = Math.floor(i / 3);
                    let x, y;
                    if (isMobileLayout) {
                        x = 50 + col * 190;
                        y = 120 + row * 180;
                    } else {
                        x = 70 + col * 185;
                        y = 130 + row * 190;
                    }
                    desks.push({ 
                        x, y, w: isMobileLayout ? 90 : 100, h: isMobileLayout ? 65 : 75, 
                        color: '#78350f', type: 'restaurant_table', orderQty: 1 
                    });
                }
            } else if (currentChar !== 'kask') {
                const gymMachines = ['bench', 'treadmill', 'squat', 'dumbbells', 'pullup', 'legpress', 'bag', 'rowing', 'bike'];
                for (let i = 0; i < 9; i++) {
                    let col = i % 3;
                    let row = Math.floor(i / 3);
                    let x, y;
                    if (isMobileLayout) {
                        x = 40 + col * 200;
                        y = 50 + row * 150;
                    } else {
                        x = 50 + col * 190;
                        y = 60 + row * 160;
                    }
                    let type = (currentChar === 'lentxo') ? gymMachines[i] : 'desk';
                    desks.push({ x, y, w: isMobileLayout ? 90 : 100, h: isMobileLayout ? 55 : 60, color: getRandomColor(currentChar), type });
                }
            }

            lastTime = performance.now();
            gameLoopId = requestAnimationFrame(loop);
        }

        function getRandomColor(char) {
            if (char === 'alpes') return '#1e88e5'; 
            if (char === 'mane') {
                const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff5252', '#69f0ae', '#ff9800']; 
                return colors[Math.floor(Math.random() * colors.length)];
            }
            return '#424242'; 
        }

        window.addEventListener('keydown', e => { getAudioContext(); keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        const bindBtn = (id, key) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); getAudioContext(); keys[key] = true; }, {passive: false});
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('touchcancel', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); getAudioContext(); keys[key] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindBtn('btn-up', 'ArrowUp'); bindBtn('btn-down', 'ArrowDown');
        bindBtn('btn-left', 'ArrowLeft'); bindBtn('btn-right', 'ArrowRight');
        
        const abtn = document.getElementById('action-btn');
        if (abtn) {
            abtn.addEventListener('touchstart', (e) => { e.preventDefault(); getAudioContext(); isActionPressed = true; }, {passive: false});
            abtn.addEventListener('touchend', (e) => { e.preventDefault(); isActionPressed = false; });
            abtn.addEventListener('touchcancel', (e) => { e.preventDefault(); isActionPressed = false; });
            abtn.addEventListener('mousedown', (e) => { e.preventDefault(); getAudioContext(); isActionPressed = true; });
            abtn.addEventListener('mouseup', (e) => { e.preventDefault(); isActionPressed = false; });
        }

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        let hintThrottleTimer = 0;

        function update(dt) {
            if (gameOver) return;

            globalTime += dt;
            updateFX(dt);
            if (hintThrottleTimer > 0) hintThrottleTimer -= dt;

            const displayW = canvas.logicalWidth;
            const displayH = canvas.logicalHeight;

            // ==================== KASK MOTORCYCLE MODE ====================
            if (currentChar === 'kask') {
                let dx = 0;
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) { dx = -player.speed * dt; }
                if (keys['ArrowRight'] || keys['d'] || keys['D']) { dx = player.speed * dt; }

                player.x += dx;
                if (player.x < 35) player.x = 35;
                if (player.x + player.w > displayW - 15) player.x = displayW - 15 - player.w;

                let inShoulder = (player.x >= kaskShoulderX);
                relieving = false;

                if (inShoulder) {
                    // PARKED AT RIGHT SHOULDER - SMOKING
                    relieving = true;
                    urge -= 35 * dt;
                    if (urge < 0) urge = 0;

                    if (Math.random() < 0.25 * dt * 60) playSfx('relieve');

                    // Smoke emissions from motorcycle parking
                    spawnParticle(player.x + 8, player.y + 10, 'rgba(235,225,255,0.85)', 5.5, Math.random()*1.5 + 0.5, -1.8, 0.9);
                    if (Math.random() < 0.3) {
                        spawnParticle(player.x + 10, player.y + 12, '#ff3d00', 2.0, Math.random()*0.8, -1.0, 0.5, true);
                    }
                } else {
                    // DRIVING ON THE ROAD - DODGING CARS
                    urge += urgeSpeed * dt;
                    let roadSpeed = 360 + score * 8;
                    kaskRoadOffset = (kaskRoadOffset + roadSpeed * dt) % 80;

                    // Spawn Cars
                    kaskSpawnTimer -= dt;
                    let baseInterval = Math.max(0.42, 1.8 - (score * 0.04) - (currentDiff === 'ext' ? 0.4 : (currentDiff === 'mod' ? 0.2 : 0)));
                    if (kaskSpawnTimer <= 0) {
                        kaskSpawnTimer = baseInterval;

                        let roadMinX = 50;
                        let roadMaxX = kaskShoulderX - 70;
                        let numLanes = isMobileLayout ? 3 : 4;
                        let laneWidth = (roadMaxX - roadMinX) / numLanes;
                        let selectedLane = Math.floor(Math.random() * numLanes);
                        let carX = roadMinX + selectedLane * laneWidth + 10;
                        let carW = 42;
                        let carH = 75;
                        let carSpeed = 160 + Math.random() * 120 + score * 4;
                        let carColors = ['#dc2626', '#2563eb', '#ca8a04', '#16a34a', '#9333ea', '#ea580c'];

                        kaskCars.push({
                            x: carX,
                            y: -90,
                            w: carW,
                            h: carH,
                            speed: carSpeed,
                            color: carColors[Math.floor(Math.random() * carColors.length)],
                            passed: false
                        });
                    }

                    // Update Cars
                    for (let i = kaskCars.length - 1; i >= 0; i--) {
                        let car = kaskCars[i];
                        car.y += (car.speed + roadSpeed * 0.4) * dt;

                        // Check dodge score
                        if (!car.passed && car.y > player.y + player.h) {
                            car.passed = true;
                            score++;
                            playSfx('work');
                            spawnFloatingText("+1", car.x + 15, car.y - 10, "#00ff88");
                        }

                        // Collision Check
                        let playerHitbox = { x: player.x + 4, y: player.y + 6, w: player.w - 8, h: player.h - 10 };
                        if (rectIntersect(playerHitbox, car)) {
                            gameOver = true;
                            failReason = 'ACCIDENTE';
                            playSfx('crash');
                            triggerShake(24);
                            spawnShockwave(player.x + player.w/2, player.y + player.h/2, '#ff0055', 70);
                            for (let p = 0; p < 25; p++) {
                                spawnParticle(player.x + 16, player.y + 25, '#ffea00', 5, (Math.random()-0.5)*8, (Math.random()-0.5)*8, 0.7, true);
                                spawnParticle(player.x + 16, player.y + 25, '#ff0055', 6, (Math.random()-0.5)*7, (Math.random()-0.5)*7, 0.6);
                            }
                        }

                        if (car.y > displayH + 120) kaskCars.splice(i, 1);
                    }
                }

                if (urge >= 100) {
                    urge = 100;
                    gameOver = true;
                    failReason = 'TABACO';
                    playSfx('gameover');
                    triggerShake(16);
                }

                document.getElementById('score').innerText = score;
                const bar = document.getElementById('urge-bar');
                bar.style.width = urge + '%';
                if (urge > 75) {
                    bar.style.background = 'linear-gradient(90deg, #ff0055, #ff5252)';
                    bar.classList.add('alarm-active');
                } else if (urge > 50) {
                    bar.style.background = 'linear-gradient(90deg, #ffea00, #ff9100)';
                    bar.classList.remove('alarm-active');
                } else {
                    bar.style.background = 'linear-gradient(90deg, #00ff88, #76ff03)';
                    bar.classList.remove('alarm-active');
                }

                return;
            }

            // ==================== STANDARD CHARACTERS MODE ====================
            let dx = 0, dy = 0;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) { dy = -player.speed * dt; player.facing = 'up'; }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) { dy = player.speed * dt; player.facing = 'down'; }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) { dx = -player.speed * dt; player.facing = 'left'; }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) { dx = player.speed * dt; player.facing = 'right'; }

            if (dx !== 0 || dy !== 0) {
                walkFrame += dt * 14;
                stepAudioTimer += dt * 60;
                if (stepAudioTimer >= 11) { playSfx('step'); stepAudioTimer = 0; }
                if (Math.random() < 0.25) {
                    spawnParticle(player.x + player.w/2, player.y + player.h - 2, 'rgba(0,240,255,0.3)', 3.0, (Math.random()-0.5)*0.8, 0.4, 0.35);
                }
            } else {
                walkFrame = 0;
            }

            player.w = (currentChar === 'lentxo') ? 44 : 34;

            let solidObjects = [...walls, ...desks];
            if (currentChar === 'jordi') {
                solidObjects.push(kitchenStation);
            }

            player.x += dx;
            solidObjects.forEach(obj => { if (obj.type !== 'knocked_out' && rectIntersect(player, obj)) player.x -= dx; });
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > displayW) player.x = displayW - player.w;

            player.y += dy;
            solidObjects.forEach(obj => { if (obj.type !== 'knocked_out' && rectIntersect(player, obj)) player.y -= dy; });
            if (player.y < 0) player.y = 0;
            if (player.y + player.h > displayH) player.y = displayH - player.h;

            if (currentChar !== 'mane' && !itemObj.active && Math.random() < 0.003 * dt * 60) {
                itemObj.x = 40 + Math.random() * (isMobileLayout ? 480 : 520);
                itemObj.y = (currentChar === 'jordi' ? 120 : 40) + Math.random() * (isMobileLayout ? 380 : 420);
                itemObj.w = 26; itemObj.h = 26;
                let collision = false;
                solidObjects.forEach(obj => { if (obj.type !== 'knocked_out' && rectIntersect(itemObj, obj)) collision = true; });
                if (!collision) itemObj.active = true;
            }

            if (itemObj.active && rectIntersect(player, itemObj)) {
                taskTimeLeft += 5;
                itemObj.active = false;
                playSfx('item');
                triggerShake(5);
                spawnShockwave(itemObj.x + 13, itemObj.y + 13, '#ffeb3b', 40);
                spawnFloatingText("+5 SEC!", player.x + 10, player.y - 15, "#ffea00");
                for (let i = 0; i < 10; i++) {
                    spawnParticle(player.x + 15, player.y + 15, '#ffeb3b', 4, (Math.random()-0.5)*4, (Math.random()-0.5)*4, 0.5, true);
                }
            }

            if (activeDeskIndex === -1) {
                taskDelay -= dt;
                if (taskDelay <= 0) {
                    let available = desks.map((d, idx) => ({d, idx})).filter(item => item.d.type !== 'knocked_out');
                    if (available.length > 0) {
                        let chosen = available[Math.floor(Math.random() * available.length)];
                        activeDeskIndex = chosen.idx;
                        taskTimeLeft = maxTaskTime; taskProgress = 0;
                        if (currentChar === 'jordi') {
                            desks[activeDeskIndex].orderQty = Math.random() < 0.5 ? 1 : 2;
                        }
                        playSfx('warn');
                    }
                }
            } else {
                taskTimeLeft -= dt;
                if (taskTimeLeft < maxTaskTime * 0.25) {
                    warnAudioTimer += dt * 60;
                    if (warnAudioTimer >= 20) { playSfx('warn'); warnAudioTimer = 0; }
                }
                if (taskTimeLeft <= 0) { 
                    gameOver = true; 
                    failReason = 'DESPEDIDO'; 
                    playSfx('gameover');
                    triggerShake(15);
                }
            }

            let atActiveDesk = false;
            if (activeDeskIndex !== -1 && desks[activeDeskIndex]) {
                let d = desks[activeDeskIndex];
                if (rectIntersect(player, {x: d.x-25, y: d.y-25, w: d.w+50, h: d.h+50})) atActiveDesk = true;
            }

            let atKitchen = false;
            if (currentChar === 'jordi') {
                atKitchen = rectIntersect(player, {x: kitchenStation.x-20, y: kitchenStation.y-20, w: kitchenStation.w+40, h: kitchenStation.h+40});
            }

            let outside = rectIntersect(player, smokingZone);
            let actionActive = keys[' '] || isActionPressed;
            interacting = false; relieving = false;

            if (actionActive) {
                if (currentChar === 'jordi' && atKitchen) {
                    if (player.chocolates < 2) {
                        cookingProgress += 80 * dt;
                        interacting = true;
                        if (Math.random() < 0.3 * dt * 60) playSfx('work');

                        spawnParticle(kitchenStation.x + 80 + Math.random()*40, kitchenStation.y + 20, '#5c2a12', 3.5, (Math.random()-0.5)*1.5, -1.8, 0.4);
                        if (Math.random() < 0.3) {
                            spawnParticle(kitchenStation.x + 80 + Math.random()*40, kitchenStation.y + 15, '#ffea00', 2, (Math.random()-0.5)*1.0, -1.2, 0.3, true);
                        }

                        if (cookingProgress >= 100) {
                            player.chocolates++;
                            cookingProgress = 0;
                            playSfx('item');
                            triggerShake(4);
                            spawnShockwave(kitchenStation.x + 100, kitchenStation.y + 30, '#d97706', 45);
                            spawnFloatingText("+1 🍫", player.x + 5, player.y - 20, "#ffb703");
                        }
                    } else if (hintThrottleTimer <= 0) {
                        spawnFloatingText("¡MAX 2 🍫!", player.x + 5, player.y - 15, "#ffeb3b");
                        hintThrottleTimer = 0.8;
                    }
                } else if (atActiveDesk) {
                    let canProceed = true;
                    let activeObj = desks[activeDeskIndex];

                    if (currentChar === 'jordi') {
                        if (player.chocolates < activeObj.orderQty) {
                            canProceed = false;
                            if (hintThrottleTimer <= 0) {
                                spawnFloatingText("¡COCINA 🍫!", player.x + 5, player.y - 15, "#ff0055");
                                hintThrottleTimer = 0.8;
                            }
                        }
                    }

                    if (canProceed) {
                        taskProgress += 75 * dt; interacting = true; 
                        if (Math.random() < 0.25 * dt * 60) playSfx('work');
                        
                        if (currentChar === 'alpes') {
                            spawnParticle(player.x + 17, player.y + 10, '#00f0ff', 2.5, (Math.random()-0.5)*2, -Math.random()*2, 0.3);
                        } else if (currentChar === 'mane') {
                            spawnParticle(player.x + 17, player.y + 20, '#ff0055', 3.5, (Math.random()-0.5)*3, (Math.random()-0.5)*3, 0.35);
                        } else if (currentChar === 'jordi') {
                            spawnParticle(player.x + 17, player.y + 15, '#d97706', 3.0, (Math.random()-0.5)*2, (Math.random()-0.5)*2, 0.35);
                        }

                        if (taskProgress >= 100) {
                            let ptsGained = 1;
                            if (currentChar === 'jordi') {
                                ptsGained = activeObj.orderQty;
                                player.chocolates -= activeObj.orderQty;
                            }
                            score += ptsGained; 

                            playSfx('complete');
                            triggerShake(7);
                            spawnShockwave(player.x + player.w/2, player.y + player.h/2, '#00ff88', 50);
                            
                            let label = '+1 CHIP!';
                            if (currentChar === 'lentxo') label = '+1 FIT!';
                            else if (currentChar === 'mane') label = '+1 K.O.!';
                            else if (currentChar === 'jordi') label = '¡SERVIDO! +' + ptsGained;

                            spawnFloatingText(label, player.x + 10, player.y - 20, "#00ff88");

                            if (desks[activeDeskIndex].type === 'person') {
                                desks[activeDeskIndex].type = 'knocked_out';
                                spawnPerson();
                                let bodies = desks.filter(d => d.type === 'knocked_out');
                                if (bodies.length > 12) {
                                    let oldestIndex = desks.findIndex(d => d.type === 'knocked_out');
                                    if (oldestIndex > -1) desks.splice(oldestIndex, 1);
                                }
                            }
                            activeDeskIndex = -1; taskDelay = Math.random() * 1.0 + 1.0; 
                            maxTaskTime -= timeReduction; 
                            if (maxTaskTime < MIN_TASK_TIME) maxTaskTime = MIN_TASK_TIME;
                        }
                    }
                } else if (outside) {
                    urge -= 32 * dt; if (urge < 0) urge = 0; relieving = true;
                    if (Math.random() < 0.2 * dt * 60) playSfx('relieve');

                    if (currentChar === 'mane') {
                        if (Math.random() < 0.5) {
                            spawnParticle(player.x + 28, player.y + 22, '#ffea00', 3.0, (Math.random()-0.5)*1.2, 0.8, 0.45);
                        }
                    } else {
                        spawnParticle(player.x + 22, player.y + 5, 'rgba(235,225,255,0.85)', 6.0, Math.random()*1.8 + 0.5, -1.8, 1.0);
                        if (Math.random() < 0.3) {
                            spawnParticle(player.x + 24, player.y + 6, '#ff3d00', 2.0, Math.random()*1.0, -1.2, 0.6, true);
                        }
                    }
                }
            }

            if (!relieving) urge += urgeSpeed * dt; 
            if (urge >= 100) { 
                urge = 100; 
                gameOver = true; 
                failReason = 'TABACO'; 
                playSfx('gameover');
                triggerShake(16);
            }

            document.getElementById('score').innerText = score;
            if (currentChar === 'jordi') {
                document.getElementById('choco-count').innerText = '🍫 ' + player.chocolates + '/2';
            }

            const bar = document.getElementById('urge-bar');
            bar.style.width = urge + '%';
            if(urge > 75) {
                bar.style.background = 'linear-gradient(90deg, #ff0055, #ff5252)';
                bar.classList.add('alarm-active');
            } else if(urge > 50) {
                bar.style.background = 'linear-gradient(90deg, #ffea00, #ff9100)';
                bar.classList.remove('alarm-active');
            } else {
                bar.style.background = 'linear-gradient(90deg, #00ff88, #76ff03)';
                bar.classList.remove('alarm-active');
            }
        }

        // --- ENHANCED GRAPHICS & CHARACTER ANIMATIONS ---
        function drawChar(ctx, c, px, py, isInteracting, isRelieving, currentUrge) {
            if (c === 'kask') {
                // DRAW MOTORCYCLE & KASK RIDER
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath(); ctx.ellipse(px + 16, py + 32, 18, 28, 0, 0, Math.PI*2); ctx.fill();

                // Wheels
                ctx.fillStyle = '#111827';
                ctx.fillRect(px + 12, py + 2, 8, 14);
                ctx.fillRect(px + 12, py + 42, 8, 16);

                // Body Chassis
                let chassisGrad = ctx.createLinearGradient(px, py, px + 32, py + 58);
                chassisGrad.addColorStop(0, '#e11d48');
                chassisGrad.addColorStop(0.5, '#be123c');
                chassisGrad.addColorStop(1, '#881337');
                ctx.fillStyle = chassisGrad;
                ctx.beginPath();
                ctx.roundRect(px + 6, py + 12, 20, 36, 8);
                ctx.fill();

                // Handlebars
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(px + 2, py + 16, 28, 4);

                // Front Headlight Beam
                let lightGrad = ctx.createRadialGradient(px + 16, py, 2, px + 16, py - 40, 50);
                lightGrad.addColorStop(0, 'rgba(255, 234, 0, 0.8)');
                lightGrad.addColorStop(1, 'rgba(255, 234, 0, 0)');
                ctx.fillStyle = lightGrad;
                ctx.beginPath();
                ctx.moveTo(px + 12, py); ctx.lineTo(px - 15, py - 60); ctx.lineTo(px + 47, py - 60); ctx.lineTo(px + 20, py);
                ctx.closePath(); ctx.fill();

                // Kask Rider Helmet & Leather Jacket
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(px + 8, py + 22, 16, 16); // Jacket

                // Helmet
                ctx.fillStyle = '#e11d48';
                ctx.beginPath(); ctx.arc(px + 16, py + 26, 9, 0, Math.PI*2); ctx.fill();
                // Neon Visor
                ctx.fillStyle = '#00f0ff'; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8;
                ctx.fillRect(px + 10, py + 21, 12, 4);
                ctx.shadowBlur = 0;

                // Tail light
                ctx.fillStyle = '#ff0055'; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 10;
                ctx.fillRect(px + 12, py + 52, 8, 4);
                ctx.shadowBlur = 0;

                ctx.restore();
                return;
            }

            const w = (c === 'lentxo') ? 44 : 34; 
            const walkOffset = Math.sin(walkFrame) * 3.5;
            
            ctx.save();
            
            // Drop Shadow
            let gradShadow = ctx.createRadialGradient(px + w/2, py + 40, 2, px + w/2, py + 40, w/1.1);
            gradShadow.addColorStop(0, 'rgba(0, 0, 0, 0.7)');
            gradShadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradShadow;
            ctx.beginPath(); ctx.ellipse(px + w/2, py + 40, w/1.2, 8, 0, 0, Math.PI*2); ctx.fill();

            const bounce = (isInteracting || isRelieving) ? Math.sin(globalTime * 18) * 2.5 : Math.sin(globalTime * 6) * 1.2;

            if (c === 'lentxo') {
                // WHEELCHAIR
                ctx.fillStyle = '#111'; 
                ctx.beginPath(); ctx.arc(px + 4, py + 28 + bounce, 13, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w - 4, py + 28 + bounce, 13, 0, Math.PI*2); ctx.fill();
                
                ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(px + 4, py + 28 + bounce, 10.5, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(px + w - 4, py + 28 + bounce, 10.5, 0, Math.PI*2); ctx.stroke();
                
                let spokeAngle = walkFrame;
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.2;
                for (let a = 0; a < 4; a++) {
                    let ang = spokeAngle + (a * Math.PI / 2);
                    ctx.beginPath();
                    ctx.moveTo(px + 4, py + 28 + bounce);
                    ctx.lineTo(px + 4 + Math.cos(ang) * 10, py + 28 + bounce + Math.sin(ang) * 10);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(px + w - 4, py + 28 + bounce);
                    ctx.lineTo(px + w - 4 + Math.cos(ang) * 10, py + 28 + bounce + Math.sin(ang) * 10);
                    ctx.stroke();
                }

                ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 2.0;
                ctx.beginPath(); ctx.arc(px + 4, py + 28 + bounce, 12, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(px + w - 4, py + 28 + bounce, 12, 0, Math.PI*2); ctx.stroke();

                ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3.5;
                ctx.beginPath(); 
                ctx.moveTo(px + 8, py + 14 + bounce); 
                ctx.lineTo(px + 8, py + 34 + bounce); 
                ctx.lineTo(px + w - 8, py + 34 + bounce); 
                ctx.stroke();

                ctx.fillStyle = '#ff9800'; ctx.fillRect(px + 8, py + 16 + bounce, w - 16, 14); 
                ctx.fillStyle = '#222'; ctx.fillRect(px + 7, py + 38, 7, 7); ctx.fillRect(px + w - 14, py + 38, 7, 7);
            } else {
                // BODY & LEGS
                ctx.fillStyle = '#1e293b'; 
                ctx.fillRect(px + 6 + walkOffset, py + 38 + bounce, 9, 5); 
                ctx.fillRect(px + w - 15 - walkOffset, py + 38 + bounce, 9, 5);

                ctx.fillStyle = '#0f172a'; 
                ctx.fillRect(px + 7 + walkOffset/2, py + 32 + bounce, 8, 8); 
                ctx.fillRect(px + w - 15 - walkOffset/2, py + 32 + bounce, 8, 8);

                if (c === 'alpes') {
                    let jacketGrad = ctx.createLinearGradient(px, py + 12, px + w, py + 34);
                    jacketGrad.addColorStop(0, '#1d4ed8'); jacketGrad.addColorStop(1, '#1e40af');
                    ctx.fillStyle = jacketGrad;
                    ctx.fillRect(px + 5, py + 14 + bounce, w-10, 24);
                    ctx.fillStyle = '#60a5fa'; ctx.fillRect(px + w/2 - 2, py + 14 + bounce, 4, 24); 
                    ctx.fillStyle = '#ffeb3b'; ctx.fillRect(px + 8, py + 18 + bounce, 4, 4); 
                } else if (c === 'mane') {
                    let maneGrad = ctx.createLinearGradient(px, py + 12, px + w, py + 34);
                    maneGrad.addColorStop(0, '#06b6d4'); maneGrad.addColorStop(1, '#0891b2');
                    ctx.fillStyle = maneGrad;
                    ctx.fillRect(px + 4, py + 14 + bounce, w-8, 24);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(px + 10, py + 14 + bounce, w-20, 24);
                    ctx.fillStyle = '#ffea00'; ctx.fillRect(px + w/2 - 3, py + 19 + bounce, 6, 3); 
                } else if (c === 'jordi') {
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillRect(px + 4, py + 14 + bounce, w - 8, 24);
                    ctx.fillStyle = '#dc2626';
                    ctx.beginPath();
                    ctx.moveTo(px + w/2 - 5, py + 14 + bounce);
                    ctx.lineTo(px + w/2 + 5, py + 14 + bounce);
                    ctx.lineTo(px + w/2, py + 22 + bounce);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(px + w/2 - 6, py + 22 + bounce, 3, 3);
                    ctx.fillRect(px + w/2 + 3, py + 22 + bounce, 3, 3);
                    ctx.fillRect(px + w/2 - 6, py + 28 + bounce, 3, 3);
                    ctx.fillRect(px + w/2 + 3, py + 28 + bounce, 3, 3);
                } else if (c === 'npc') {
                    ctx.fillStyle = '#ea580c'; 
                    ctx.fillRect(px + 5, py + 14 + bounce, w-10, 24);
                }
            }
            
            // HEAD & SKIN
            ctx.fillStyle = '#fbcfe8'; 
            ctx.beginPath(); ctx.arc(px + w/2, py + 10 + bounce, 12, 0, Math.PI*2); ctx.fill();
            
            // HAIR / HAT / STYLES
            if (c === 'alpes') {
                ctx.fillStyle = '#451a03'; 
                ctx.beginPath(); ctx.arc(px + w/2, py + 8 + bounce, 13, Math.PI*1.0, Math.PI*2.0); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.strokeRect(px + w/2 - 9, py + 8 + bounce, 7, 5);
                ctx.strokeRect(px + w/2 + 2, py + 8 + bounce, 7, 5);
                ctx.beginPath(); ctx.moveTo(px + w/2 - 2, py + 10 + bounce); ctx.lineTo(px + w/2 + 2, py + 10 + bounce); ctx.stroke();
            } else if (c === 'lentxo') {
                ctx.fillStyle = '#dc2626'; 
                ctx.fillRect(px + w/2 - 13, py + 4 + bounce, 26, 5);
                ctx.fillStyle = '#78350f'; 
                ctx.fillRect(px + w/2 - 12, py + 1 + bounce, 24, 4);
            } else if (c === 'mane') {
                ctx.fillStyle = '#0f172a'; 
                ctx.beginPath(); ctx.arc(px + w/2, py + 6 + bounce, 14, Math.PI*0.8, Math.PI*2.1); ctx.fill();
            } else if (c === 'jordi') {
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(px + w/2 - 12, py + 1 + bounce, 24, 6);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(px + w/2 - 8, py - 6 + bounce, 9, 0, Math.PI*2);
                ctx.arc(px + w/2 + 8, py - 6 + bounce, 9, 0, Math.PI*2);
                ctx.arc(px + w/2, py - 12 + bounce, 12, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; ctx.stroke();

                ctx.fillStyle = '#451a03';
                ctx.beginPath();
                ctx.arc(px + w/2, py + 13 + bounce, 5, 0, Math.PI);
                ctx.fill();
            } else {
                ctx.fillStyle = '#78350f';
                ctx.beginPath(); ctx.arc(px + w/2, py + 8 + bounce, 12.5, Math.PI*1.1, Math.PI*1.9); ctx.fill();
            }

            // EYES & EXPRESSIONS
            if (currentUrge > 75) {
                ctx.fillStyle = '#ff0055';
                ctx.beginPath(); ctx.arc(px + w/2 - 4.5, py + 10.5 + bounce, 3.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w/2 + 4.5, py + 10.5 + bounce, 3.5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(px + w/2 - 4.5, py + 10.5 + bounce, 1.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w/2 + 4.5, py + 10.5 + bounce, 1.2, 0, Math.PI*2); ctx.fill();

                let sweatY = py + 2 + Math.sin(globalTime * 12) * 4;
                ctx.fillStyle = '#00f0ff';
                ctx.beginPath(); ctx.arc(px + w/2 + 13, sweatY, 2.5, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(px + w/2 - 4.5, py + 10.5 + bounce, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w/2 + 4.5, py + 10.5 + bounce, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath(); ctx.arc(px + w/2 - 4.5, py + 10.5 + bounce, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w/2 + 4.5, py + 10.5 + bounce, 1.5, 0, Math.PI*2); ctx.fill();
            }

            // MOUTH & DRINKING / SMOKING
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1.8; ctx.beginPath();
            if (isRelieving) {
                if (c === 'mane') {
                    ctx.arc(px + w/2, py + 15 + bounce, 3.5, 0, Math.PI); ctx.stroke();
                    ctx.fillStyle = '#ffea00'; ctx.fillRect(px + w/2 + 4, py + 8 + bounce, 11, 15);
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(px + w/2 + 4, py + 5 + bounce, 11, 4.5);
                    ctx.strokeStyle = '#d97706'; ctx.strokeRect(px + w/2 + 4, py + 8 + bounce, 11, 15);
                } else {
                    ctx.arc(px + w/2, py + 16 + bounce, 2, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(px + w/2, py + 15 + bounce, 12, 3);
                    ctx.fillStyle = '#ff3d00'; ctx.fillRect(px + w/2 + 12, py + 15 + bounce, 3.5, 3);
                }
            } else if (currentUrge > 75) { 
                ctx.arc(px + w/2, py + 18 + bounce, 5, Math.PI, 0); ctx.stroke();
            } else { 
                ctx.arc(px + w/2, py + 15 + bounce, 4, 0, Math.PI); ctx.stroke(); 
            }

            // ANIMATED ARMS & CHOCOLATE TRAY FOR JORDI
            ctx.fillStyle = '#fbcfe8';

            if (c === 'jordi' && player.chocolates > 0) {
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(px + w/2 - 16, py + 22 + bounce, 32, 6);
                ctx.fillStyle = '#3d1e0d';
                for (let ch = 0; ch < player.chocolates; ch++) {
                    ctx.fillRect(px + w/2 - 12 + ch * 14, py + 17 + bounce, 10, 6);
                    ctx.fillStyle = '#ffea00';
                    ctx.fillRect(px + w/2 - 12 + ch * 14, py + 17 + bounce, 3, 6);
                    ctx.fillStyle = '#3d1e0d';
                }
            } else if (isInteracting) {
                if (c === 'alpes') {
                    let leftArmY = py + 22 + Math.sin(globalTime * 25) * 3;
                    let rightArmY = py + 22 + Math.cos(globalTime * 25) * 3;
                    ctx.beginPath(); ctx.arc(px - 1, leftArmY, 4.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px + w + 1, rightArmY, 4.5, 0, Math.PI*2); ctx.fill();
                } else if (c === 'lentxo') {
                    let liftArm = Math.abs(Math.sin(globalTime * 14)) * 9;
                    ctx.beginPath(); ctx.arc(px - 2, py + 24 - liftArm, 5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px + w + 2, py + 24 - liftArm, 5, 0, Math.PI*2); ctx.fill();
                } else if (c === 'mane') {
                    let punchLeft = Math.sin(globalTime * 30) > 0 ? 14 : 0;
                    let punchRight = Math.sin(globalTime * 30) <= 0 ? 14 : 0;
                    ctx.fillStyle = '#dc2626';
                    ctx.beginPath(); ctx.arc(px - 2 + punchLeft, py + 22, 6.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px + w + 2 + punchRight, py + 22, 6.5, 0, Math.PI*2); ctx.fill();
                } else if (c === 'jordi') {
                    let cookArm = Math.sin(globalTime * 20) * 4;
                    ctx.beginPath(); ctx.arc(px - 2, py + 24 + cookArm, 5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px + w + 2 - cookArm, py + 24, 5, 0, Math.PI*2); ctx.fill();
                }
            } else if (!isRelieving) {
                ctx.beginPath(); ctx.arc(px + 1, py + 25 + bounce, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w - 1, py + 25 + bounce, 4, 0, Math.PI*2); ctx.fill();
            }

            ctx.restore();
        }

        function drawPortraits() {
            ['alpes', 'lentxo', 'mane', 'jordi', 'kask'].forEach(c => {
                const cvs = document.getElementById('port-' + c);
                if(cvs) {
                    const pCtx = cvs.getContext('2d'); pCtx.clearRect(0,0,120,120); pCtx.save();
                    const scale = (c==='lentxo') ? 2.1 : (c==='jordi' ? 1.9 : (c==='kask' ? 1.7 : 2.3)); 
                    pCtx.scale(scale, scale);
                    drawChar(pCtx, c, (c==='jordi'? 14:(c==='kask'?18:8)), (c==='jordi'? 12:(c==='kask'?12:4)), false, false, 0); 
                    pCtx.restore();
                }
            });
        }
        drawPortraits();

        function drawGymMachine(ctx, type, x, y, w, h) {
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.55)'; 
            ctx.fillRect(x + 8, y + 8, w, h); 
            ctx.fillStyle = '#1e1b2e'; ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, w, h);
            
            let pulse = Math.sin(globalTime * 8) * 4;

            switch(type) {
                case 'bench':
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(x+10, y+10, w-20, h-20); 
                    ctx.fillStyle = '#dc2626'; ctx.fillRect(x+25, y+14, w-50, h-28); 
                    ctx.fillStyle = '#94a3b8'; ctx.fillRect(x+15, y+4, 8, h-8); ctx.fillRect(x+w-23, y+4, 8, h-8); 
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(x+8, y+22 + pulse*0.3, w-16, 6); 
                    break;
                case 'treadmill':
                    ctx.fillStyle = '#020617'; ctx.fillRect(x+12, y+5, w-24, h-10); 
                    ctx.fillStyle = '#334155'; ctx.fillRect(x+18, y+10, w-36, h-20); 
                    ctx.fillStyle = '#ff9800';
                    let beltShift = (globalTime * 40) % (w - 36);
                    ctx.fillRect(x + 18 + beltShift, y + 10, 6, h - 20);
                    ctx.fillStyle = '#00f0ff'; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8;
                    ctx.fillRect(x+28, y+7, 26, 7);
                    break;
                default:
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(x+10, y+10, w-20, h-20);
                    break;
            }
            ctx.restore();
        }

        function drawParkBench(ctx, x, y, width = 54, vertical = false) {
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            if (vertical) {
                ctx.beginPath(); ctx.ellipse(x + 12, y + width/2, 12, width/1.8, 0, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.beginPath(); ctx.ellipse(x + width/2, y + 14, width/1.8, 8, 0, 0, Math.PI*2); ctx.fill();
            }

            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            if (vertical) {
                ctx.fillRect(x + 2, y + 4, 20, 5); ctx.fillRect(x + 2, y + width - 9, 20, 5);
            } else {
                ctx.fillRect(x + 4, y + 2, 5, 20); ctx.fillRect(x + width - 9, y + 2, 5, 20);
            }

            if (vertical) {
                for (let i = 0; i < 4; i++) {
                    let lx = x + 4 + i * 5;
                    let woodGrad = ctx.createLinearGradient(lx, y, lx + 4, y + width);
                    woodGrad.addColorStop(0, '#92400e'); woodGrad.addColorStop(0.5, '#b45309'); woodGrad.addColorStop(1, '#78350f');
                    ctx.fillStyle = woodGrad; ctx.fillRect(lx, y, 4, width);
                    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 0.8; ctx.strokeRect(lx, y, 4, width);
                }
            } else {
                for (let i = 0; i < 4; i++) {
                    let ly = y + 2 + i * 5;
                    let woodGrad = ctx.createLinearGradient(x, ly, x + width, ly + 4);
                    woodGrad.addColorStop(0, '#92400e'); woodGrad.addColorStop(0.5, '#b45309'); woodGrad.addColorStop(1, '#78350f');
                    ctx.fillStyle = woodGrad; ctx.fillRect(x, ly, width, 4);
                    ctx.strokeStyle = '#451a03'; ctx.lineWidth = 0.8; ctx.strokeRect(x, ly, width, 4);
                }
            }
            ctx.restore();
        }

        function drawDetailedTree(ctx, tx, ty, scale = 1.0) {
            ctx.save();
            ctx.translate(tx, ty);
            ctx.scale(scale, scale);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.beginPath(); ctx.ellipse(0, 32, 32, 12, 0, 0, Math.PI*2); ctx.fill();

            let trunkGrad = ctx.createLinearGradient(-10, 0, 10, 0);
            trunkGrad.addColorStop(0, '#2d1810'); trunkGrad.addColorStop(0.4, '#543310'); trunkGrad.addColorStop(1, '#1b0d08');
            ctx.fillStyle = trunkGrad;
            ctx.beginPath(); ctx.moveTo(-7, -5); ctx.lineTo(7, -5); ctx.lineTo(11, 32); ctx.lineTo(-11, 32); ctx.closePath(); ctx.fill();

            const clusters = [
                { x: 0, y: -28, r: 30, c1: '#064e3b', c2: '#047857' },
                { x: -16, y: -18, r: 24, c1: '#065f46', c2: '#059669' },
                { x: 16, y: -18, r: 24, c1: '#047857', c2: '#10b981' },
                { x: -10, y: -38, r: 22, c1: '#059669', c2: '#34d399' },
                { x: 10, y: -38, r: 22, c1: '#10b981', c2: '#6ee7b7' },
                { x: 0, y: -48, r: 18, c1: '#34d399', c2: '#a7f3d0' }
            ];

            clusters.forEach(cl => {
                let leafGrad = ctx.createRadialGradient(cl.x - cl.r*0.3, cl.y - cl.r*0.3, 2, cl.x, cl.y, cl.r);
                leafGrad.addColorStop(0, cl.c2); leafGrad.addColorStop(1, cl.c1);
                ctx.fillStyle = leafGrad;
                ctx.beginPath(); ctx.arc(cl.x, cl.y, cl.r, 0, Math.PI * 2); ctx.fill();
            });

            ctx.restore();
        }

        function drawParkLamp(ctx, sx, sy) {
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(sx, sy + 48, 10, 4, 0, 0, Math.PI*2); ctx.fill();

            let postGrad = ctx.createLinearGradient(sx - 4, sy, sx + 4, sy);
            postGrad.addColorStop(0, '#0f172a'); postGrad.addColorStop(0.5, '#334155'); postGrad.addColorStop(1, '#020617');
            ctx.fillStyle = postGrad; ctx.fillRect(sx - 4, sy, 8, 48); 

            ctx.fillStyle = '#ffea00'; ctx.shadowColor = '#ffea00'; ctx.shadowBlur = 18;
            ctx.beginPath(); ctx.arc(sx, sy - 6, 6, 0, Math.PI*2); ctx.fill(); 
            ctx.shadowBlur = 0;

            let lightGrad = ctx.createRadialGradient(sx, sy + 15, 4, sx, sy + 15, 65);
            lightGrad.addColorStop(0, 'rgba(254, 240, 138, 0.45)');
            lightGrad.addColorStop(0.6, 'rgba(253, 224, 71, 0.15)');
            lightGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = lightGrad; 
            ctx.beginPath(); ctx.arc(sx, sy + 15, 65, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawParkTrash(ctx, x, y) {
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(x + 8, y + 20, 10, 4, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#334155'; ctx.fillRect(x, y, 16, 20);
            ctx.fillStyle = '#78350f'; ctx.fillRect(x+2, y+2, 12, 16);
            ctx.fillStyle = '#94a3b8'; ctx.fillRect(x-1, y-3, 18, 4);
            ctx.fillStyle = '#ff3d00'; ctx.fillRect(x+7, y-2, 2, 2);
            ctx.restore();
        }

        function drawFlowers(ctx, fx, fy) {
            ctx.save();
            const colors = ['#facc15', '#f43f5e', '#38bdf8', '#a855f7'];
            for (let i = 0; i < 5; i++) {
                let ox = (i % 3) * 6 - 6;
                let oy = Math.floor(i / 3) * 6;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath(); ctx.arc(fx + ox, fy + oy, 2.5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(fx + ox, fy + oy, 1, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        // --- HIGH-QUALITY MAP DRAWING ---
        function draw() {
            ctx.save();
            if (screenShake > 0) {
                let rx = (Math.random() - 0.5) * screenShake;
                let ry = (Math.random() - 0.5) * screenShake;
                ctx.translate(rx, ry);
            }

            const displayW = canvas.logicalWidth;
            const displayH = canvas.logicalHeight;

            // ==================== DRAW KASK MOTORCYCLE HIGHWAY ====================
            if (currentChar === 'kask') {
                // Background Grass
                ctx.fillStyle = '#064e3b'; ctx.fillRect(0, 0, displayW, displayH);

                // Main Asphalt Road
                let roadWidth = kaskShoulderX - 35;
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(35, 0, roadWidth, displayH);

                // Outer Road Lines
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(35, 0, 4, displayH); // Left solid border line

                // Animated Lane Dash Lines
                let numLanes = isMobileLayout ? 3 : 4;
                let laneW = roadWidth / numLanes;
                ctx.fillStyle = '#e2e8f0';

                for (let l = 1; l < numLanes; l++) {
                    let lx = 35 + l * laneW;
                    for (let y = -80 + kaskRoadOffset; y < displayH + 80; y += 80) {
                        ctx.fillRect(lx - 2, y, 4, 42);
                    }
                }

                // Right Shoulder (Arcén)
                let shoulderGrad = ctx.createLinearGradient(kaskShoulderX, 0, displayW, 0);
                shoulderGrad.addColorStop(0, '#334155');
                shoulderGrad.addColorStop(1, '#0f172a');
                ctx.fillStyle = shoulderGrad;
                ctx.fillRect(kaskShoulderX, 0, displayW - kaskShoulderX, displayH);

                // Right Shoulder Stripe / Indicator Line
                ctx.strokeStyle = '#ff3d00'; ctx.lineWidth = 3; ctx.setLineDash([12, 12]);
                ctx.beginPath(); ctx.moveTo(kaskShoulderX, 0); ctx.lineTo(kaskShoulderX, displayH); ctx.stroke();
                ctx.setLineDash([]);

                // Arcén Text Signs
                ctx.fillStyle = 'rgba(255, 235, 59, 0.25)';
                ctx.font = "900 13px 'Press Start 2P', monospace"; ctx.textAlign = 'center';
                for (let sy = 80; sy < displayH; sy += 220) {
                    ctx.save();
                    ctx.translate(kaskShoulderX + (displayW - kaskShoulderX)/2, sy);
                    ctx.rotate(Math.PI / 2);
                    ctx.fillText('ARCÉN / FUMAR 🚬', 0, 0);
                    ctx.restore();
                }

                // Draw Oncoming Cars
                kaskCars.forEach(car => {
                    ctx.save();
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(car.x + 6, car.y + 6, car.w, car.h);

                    // Car Main Body
                    let carGrad = ctx.createLinearGradient(car.x, car.y, car.x + car.w, car.y + car.h);
                    carGrad.addColorStop(0, car.color);
                    carGrad.addColorStop(1, '#0f172a');
                    ctx.fillStyle = carGrad;
                    ctx.beginPath(); ctx.roundRect(car.x, car.y, car.w, car.h, 10); ctx.fill();

                    // Roof / Windshield
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(car.x + 4, car.y + 18, car.w - 8, car.h - 36);
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(car.x + 6, car.y + 14, car.w - 12, 10); // Front glass
                    ctx.fillRect(car.x + 6, car.y + car.h - 22, car.w - 12, 8); // Rear glass

                    // Headlights (facing down)
                    ctx.fillStyle = '#ffeb3b'; ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 10;
                    ctx.fillRect(car.x + 4, car.y + car.h - 4, 8, 4);
                    ctx.fillRect(car.x + car.w - 12, car.y + car.h - 4, 8, 4);
                    ctx.shadowBlur = 0;

                    ctx.restore();
                });

                // Draw Kask Rider
                drawChar(ctx, 'kask', player.x, player.y, false, relieving, urge);

                if (relieving) {
                    ctx.fillStyle = '#00ff88'; ctx.font = "900 12px 'Press Start 2P', monospace"; ctx.textAlign = 'center';
                    ctx.fillText('FUMANDO EN ARCÉN 🚬', player.x + 16, player.y - 18);
                }

                drawFX(ctx);
                ctx.restore();

                if (gameOver) {
                    screens.canvas.style.display = 'none'; screens.ui.style.display = 'none';
                    mobileControls.style.display = 'none';
                    screens.gameover.style.display = 'flex';
                    
                    const d = DICT[currentLang];
                    document.getElementById('go-reason').innerText = (failReason === 'TABACO') ? d.estallado : d.accidente;
                    document.getElementById('go-score').innerText = d.scoreIs + score + " " + d[currentChar + '_score'];
                }
                return;
            }

            // ==================== STANDARD CHARACTERS DRAWING ====================
            const maxXTile = isMobileLayout ? 600 : 640;
            const maxYTile = isMobileLayout ? 560 : 600;

            if (currentChar === 'mane') {
                ctx.fillStyle = '#0b021a'; ctx.fillRect(0, 0, displayW, displayH);
                for(let i=0; i<maxXTile; i+=40) {
                    for(let j=0; j<maxYTile; j+=40) {
                        ctx.fillStyle = ((i/40 + j/40) % 2 === 0) ? '#12052b' : '#0a0218';
                        ctx.fillRect(i, j, 40, 40);
                        ctx.strokeStyle = 'rgba(157, 78, 221, 0.15)'; ctx.lineWidth = 1; 
                        ctx.strokeRect(i+0.5, j+0.5, 39, 39);
                    }
                }
                ctx.fillStyle = '#1c073a'; ctx.fillRect(160, 140, 320, 280);
                ctx.strokeStyle = '#d800ff'; ctx.lineWidth = 2; ctx.strokeRect(160, 140, 320, 280);
                
                ctx.fillStyle = '#ff00ff'; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 18;
                ctx.font = "900 32px 'Press Start 2P', monospace"; ctx.textAlign = 'center';
                ctx.fillText('CLUB NEON', displayW / 2, 42); ctx.shadowBlur = 0;

            } else if (currentChar === 'lentxo') {
                ctx.fillStyle = '#0b0f19'; ctx.fillRect(0, 0, displayW, displayH);
                for(let i=0; i<maxXTile; i+=40) {
                    for(let j=0; j<maxYTile; j+=40) {
                        ctx.fillStyle = ((i/40 + j/40) % 2 === 0) ? '#111827' : '#1f2937'; 
                        ctx.fillRect(i, j, 40, 40);
                        ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1; 
                        ctx.strokeRect(i+0.5, j+0.5, 39, 39);
                    }
                }
                ctx.fillStyle = '#00f0ff'; ctx.font = "900 14px 'Orbitron', sans-serif"; ctx.textAlign = 'center';
                ctx.fillText('POWER GYM - FITNESS CENTER', 370, 22);

            } else if (currentChar === 'jordi') {
                ctx.fillStyle = '#1e050b'; ctx.fillRect(0, 0, displayW, displayH);
                for(let i=0; i<maxXTile; i+=40) {
                    for(let j=0; j<maxYTile; j+=40) {
                        ctx.fillStyle = ((i/40 + j/40) % 2 === 0) ? '#3b0712' : '#27040a';
                        ctx.fillRect(i, j, 40, 40);
                        ctx.strokeStyle = 'rgba(217, 119, 6, 0.15)'; ctx.lineWidth = 1; 
                        ctx.strokeRect(i + 0.5, j + 0.5, 39, 39);
                    }
                }

                ctx.fillStyle = '#334155';
                ctx.fillRect(kitchenStation.x, kitchenStation.y, kitchenStation.w, kitchenStation.h);
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
                ctx.strokeRect(kitchenStation.x, kitchenStation.y, kitchenStation.w, kitchenStation.h);

                ctx.fillStyle = '#0f172a';
                ctx.fillRect(kitchenStation.x + 10, kitchenStation.y + 10, 50, 45);
                ctx.fillStyle = '#ff3d00'; ctx.shadowColor = '#ff3d00'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(kitchenStation.x + 35, kitchenStation.y + 32, 14, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#4a210d';
                ctx.beginPath(); ctx.arc(kitchenStation.x + 110, kitchenStation.y + 32, 22, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#d97706'; ctx.lineWidth = 3; ctx.stroke();
                
                let bubble = Math.sin(globalTime * 12) * 3;
                ctx.fillStyle = '#6e3415';
                ctx.beginPath(); ctx.arc(kitchenStation.x + 105 + bubble, kitchenStation.y + 30, 6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(kitchenStation.x + 118, kitchenStation.y + 34 - bubble, 4, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = '#ffea00'; ctx.font = "900 13px 'Press Start 2P', monospace"; ctx.textAlign = 'left';
                ctx.fillText('🍳 COCINA DE JORDI 🍫', kitchenStation.x + 210, kitchenStation.y + 35);

                if (cookingProgress > 0) {
                    ctx.fillStyle = '#000'; ctx.fillRect(kitchenStation.x, kitchenStation.y + kitchenStation.h + 4, kitchenStation.w, 10);
                    ctx.fillStyle = '#d97706'; ctx.fillRect(kitchenStation.x + 1, kitchenStation.y + kitchenStation.h + 5, (kitchenStation.w - 2) * (cookingProgress/100), 8);
                }

            } else {
                ctx.fillStyle = '#0a0f1d'; ctx.fillRect(0, 0, displayW, displayH);
                for(let i=0; i<maxXTile; i+=40) {
                    for(let j=0; j<maxYTile; j+=40) {
                        ctx.fillStyle = ((i/40 + j/40) % 2 === 0) ? '#0f172a' : '#0a0f1d';
                        ctx.fillRect(i, j, 40, 40);
                        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.strokeRect(i + 0.5, j + 0.5, 39, 39);
                    }
                }
            }

            // OUTDOOR ZONE
            ctx.fillStyle = '#030208'; 
            ctx.fillRect(smokingZone.x, smokingZone.y, smokingZone.w, smokingZone.h);
            
            if (currentChar === 'mane') {
                if (isMobileLayout) {
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 560, 600, 140);
                    drawParkBench(ctx, 40, 580, 60); drawParkBench(ctx, 480, 580, 60);
                } else {
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(650, 0, 150, 600);
                    drawParkBench(ctx, 680, 80, 54, true); drawParkBench(ctx, 680, 440, 54, true);
                    drawParkTrash(ctx, 720, 200);
                }
            } else {
                if (isMobileLayout) {
                    let grassGrad = ctx.createLinearGradient(0, 560, 0, 700);
                    grassGrad.addColorStop(0, '#166534'); grassGrad.addColorStop(1, '#14532d');
                    ctx.fillStyle = grassGrad; ctx.fillRect(0, 560, 600, 140); 

                    drawParkBench(ctx, 80, 590, 65); drawParkBench(ctx, 440, 590, 65);
                    drawDetailedTree(ctx, 50, 610, 0.85); drawDetailedTree(ctx, 550, 610, 0.85);
                    drawParkLamp(ctx, 220, 580); drawParkLamp(ctx, 380, 580);
                    drawFlowers(ctx, 180, 620); drawFlowers(ctx, 410, 620);
                } else {
                    let grassGrad = ctx.createLinearGradient(650, 0, 800, 0);
                    grassGrad.addColorStop(0, '#15803d'); grassGrad.addColorStop(1, '#14532d');
                    ctx.fillStyle = grassGrad; ctx.fillRect(650, 0, 150, 600); 

                    drawParkBench(ctx, 675, 70, 55, true); drawParkBench(ctx, 675, 450, 55, true);
                    drawParkTrash(ctx, 745, 210);
                    drawDetailedTree(ctx, 740, 60, 0.9); drawDetailedTree(ctx, 745, 520, 0.9);
                    drawParkLamp(ctx, 725, 170); drawParkLamp(ctx, 725, 410);
                    drawFlowers(ctx, 670, 190); drawFlowers(ctx, 670, 400);
                }
            }

            // Walls and Exit Door
            ctx.fillStyle = '#0f172a';
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.fillStyle = '#334155';
                if (isMobileLayout) {
                    for(let x=w.x; x<w.x+w.w; x+=20) ctx.fillRect(x, w.y, 2, w.h);
                } else {
                    for(let y=w.y; y<w.y+w.h; y+=20) ctx.fillRect(w.x, y, w.w, 2);
                }
                ctx.fillStyle = '#0f172a';
            });

            let exitFlicker = Math.sin(globalTime * 15) > -0.8 ? '#ff0055' : '#770022';
            ctx.fillStyle = exitFlicker; ctx.shadowColor = exitFlicker; ctx.shadowBlur = 12;
            if (isMobileLayout) {
                ctx.fillRect(220, 540, 160, 20); 
                ctx.fillStyle = '#fff'; ctx.font = "900 14px 'Press Start 2P', monospace"; ctx.textAlign = 'center';
                ctx.fillText('EXIT', 300, 555);
            } else {
                ctx.fillRect(630, 240, 20, 120); 
                ctx.fillStyle = '#fff'; ctx.font = "900 16px 'Press Start 2P', monospace"; ctx.textAlign = 'center';
                ctx.fillText('E', 640, 265); ctx.fillText('X', 640, 290); ctx.fillText('I', 640, 315); ctx.fillText('T', 640, 340);
            }
            ctx.shadowBlur = 0;

            if (itemObj.active) {
                ctx.save();
                ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 14;
                if (currentChar === 'jordi') {
                    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(itemObj.x+13, itemObj.y+15, 10, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#3d1e0d'; ctx.beginPath(); ctx.arc(itemObj.x+13, itemObj.y+18, 9, 0, Math.PI); ctx.fill();
                    ctx.fillStyle = '#22c55e'; ctx.fillRect(itemObj.x+11, itemObj.y+3, 5, 4);
                } else if (currentChar === 'alpes') {
                    ctx.fillStyle = '#c084fc'; 
                    ctx.beginPath(); ctx.arc(itemObj.x+13, itemObj.y+15, 12, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#22c55e'; ctx.fillRect(itemObj.x+12, itemObj.y-1, 4, 8);
                } else if (currentChar === 'lentxo') {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(itemObj.x+8, itemObj.y+13, 8.5, Math.PI/2, Math.PI*1.5); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(itemObj.x+18, itemObj.y+13, 8.5, -Math.PI/2, Math.PI/2); ctx.fill();
                    ctx.fillRect(itemObj.x+8, itemObj.y+4.5, 10, 17);
                }
                ctx.restore();
            }

            desks.forEach((d, i) => {
                if (d.type === 'restaurant_table') {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(d.x + 6, d.y + 6, d.w, d.h);
                    ctx.fillStyle = '#78350f'; ctx.fillRect(d.x, d.y, d.w, d.h);
                    ctx.fillStyle = '#f8fafc'; ctx.fillRect(d.x + 8, d.y + 6, d.w - 16, d.h - 12);
                    
                    ctx.fillStyle = '#ffea00'; ctx.shadowColor = '#ffea00'; ctx.shadowBlur = 8;
                    ctx.beginPath(); ctx.arc(d.x + d.w/2, d.y + d.h/2, 4, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;

                    drawChar(ctx, 'npc', d.x + 8, d.y - 18, false, false, 0);
                    drawChar(ctx, 'npc', d.x + d.w - 38, d.y - 18, false, false, 0);

                } else if (d.type === 'knocked_out') {
                    ctx.save(); ctx.translate(d.x + d.w/2, d.y + d.h/2); ctx.rotate(Math.PI / 2); 
                    ctx.globalAlpha = 0.65; drawChar(ctx, 'npc', -17, -22, false, false, 0); 
                    ctx.fillStyle = d.color; ctx.fillRect(-11, -6, 22, 26); 
                    ctx.fillStyle = '#ffeb3b'; ctx.font = '900 16px sans-serif'; ctx.textAlign = 'center'; 
                    ctx.fillText('💫', -6, -22);
                    ctx.restore();
                } else if (d.type === 'person') {
                    drawChar(ctx, 'npc', d.x, d.y, false, false, 0); 
                    ctx.fillStyle = d.color; ctx.fillRect(d.x + 5, d.y + 15, 24, 26); 
                } else if (d.type === 'desk') {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(d.x + 8, d.y + 8, d.w, d.h); 
                    ctx.fillStyle = '#1d4ed8'; ctx.fillRect(d.x, d.y, d.w, d.h);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(d.x + 10, d.y + 8, 46, 26); 
                    ctx.fillStyle = '#10b981'; ctx.fillRect(d.x + 12, d.y + 10, 42, 22);
                } else {
                    drawGymMachine(ctx, d.type, d.x, d.y, d.w, d.h);
                }

                if (i === activeDeskIndex && d.type !== 'knocked_out') {
                    let cx = d.x + d.w/2; let cy = d.y - 20;
                    
                    ctx.save();
                    ctx.strokeStyle = (Math.floor(globalTime * 6) % 2 === 0) ? '#ff1744' : '#ffea00';
                    ctx.lineWidth = 3.5; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12;
                    ctx.strokeRect(d.x - 5, d.y - 5, d.w + 10, d.h + 10);
                    ctx.restore();

                    if (currentChar === 'jordi') {
                        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.roundRect(cx - 36, cy - 22, 72, 28, 8); ctx.fill(); ctx.stroke();
                        ctx.fillStyle = '#000'; ctx.font = "900 12px sans-serif"; ctx.textAlign = 'center';
                        ctx.fillText(`💬 🍫x${d.orderQty}`, cx, cy - 4);
                    } else {
                        ctx.fillStyle = (Math.floor(globalTime * 6) % 2 === 0) ? '#ff1744' : '#ffea00';
                        ctx.font = "900 32px 'Orbitron', sans-serif"; ctx.textAlign = 'center'; ctx.fillText('❗', cx, cy);
                    }

                    ctx.fillStyle = '#000'; ctx.fillRect(cx - 40, cy + 8, 80, 10);
                    let timePct = Math.max(0, taskTimeLeft / maxTaskTime);
                    ctx.fillStyle = timePct > 0.3 ? '#00f0ff' : '#ff1744'; ctx.fillRect(cx - 39, cy + 9, 78 * timePct, 8);

                    if (taskProgress > 0) {
                        ctx.fillStyle = '#000'; ctx.fillRect(cx - 40, d.y + d.h + 6, 80, 10);
                        ctx.fillStyle = '#ffea00'; ctx.fillRect(cx - 39, d.y + d.h + 7, 78 * (taskProgress/100), 8);
                    }
                }
            });

            drawChar(ctx, currentChar, player.x, player.y, interacting, relieving, urge);
            
            drawFX(ctx);
            ctx.restore();

            if (gameOver) {
                screens.canvas.style.display = 'none'; screens.ui.style.display = 'none';
                mobileControls.style.display = 'none';
                screens.gameover.style.display = 'flex';
                
                const d = DICT[currentLang];
                document.getElementById('go-reason').innerText = (failReason === 'TABACO') ? d.estallado : d.despedido;
                document.getElementById('go-score').innerText = d.scoreIs + score + " " + d[currentChar + '_score'];
            }
        }

        function loop(timestamp) {
            if (!gameOver) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.1) dt = 0.1;
                lastTime = timestamp;

                update(dt);
                draw();
                gameLoopId = requestAnimationFrame(loop);
            }
        }

        updateMenuText();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW ok:', reg.scope), err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
