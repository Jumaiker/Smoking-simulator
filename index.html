<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMOKING SIMULATOR - PRO</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d800ff">
    <link rel="apple-touch-icon" href="icono_smoking_simulator.png">

    <style>
        /* RETRO ARCADE AESTHETIC - PURPLE NEON GLOW EDITION */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root {
            --neon-purple: #d800ff;
            --neon-dark-purple: #240046;
            --neon-glow: #8a2be2;
            --neon-bright: #e0aaff;
            --arcade-yellow: #ffeb3b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0d021a;
            color: #fff;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
        }

        body { 
            background-image: 
                radial-gradient(circle at 50% 20%, #3c096c 0%, #10002b 70%),
                linear-gradient(to bottom, rgba(216, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            touch-action: none;
            padding: 5px;
        }

        /* NEON HEADING */
        .menu-game-title { 
            margin-top: 0; 
            margin-bottom: 10px; 
            color: #ffffff; 
            font-size: 2.7em; 
            text-align: center; 
            text-shadow: 
                0 0 5px #fff,
                0 0 10px var(--neon-purple),
                0 0 20px var(--neon-purple),
                0 0 40px var(--neon-glow); 
            letter-spacing: 3px; 
            line-height: 1.0;
            animation: pulseTitle 2s infinite alternate;
        }

        @keyframes pulseTitle {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple), 0 0 30px var(--neon-glow); }
            100% { text-shadow: 0 0 8px #fff, 0 0 15px var(--neon-purple), 0 0 30px var(--neon-purple), 0 0 50px var(--neon-glow), 0 0 70px #ff00ff; }
        }

        /* RETRO CIGARETTE BANNER */
        .cigarette-banner {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 8px var(--neon-purple));
        }

        @keyframes riseSmoke {
            0% { transform: translateY(0) translateX(0) scale(0.6); opacity: 0.8; }
            50% { transform: translateY(-12px) translateX(6px) scale(1); opacity: 0.4; }
            100% { transform: translateY(-24px) translateX(-4px) scale(1.4); opacity: 0; }
        }

        .smoke-1 {
            animation: riseSmoke 2.2s infinite ease-in-out;
            transform-origin: 135px 22px;
        }
        .smoke-2 {
            animation: riseSmoke 2.6s infinite ease-in-out 1.1s;
            transform-origin: 138px 20px;
        }
        
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4), inset 0 0 15px rgba(216, 0, 255, 0.2);
            border-radius: 12px;
            background: rgba(16, 0, 43, 0.85);
            border: 2px solid var(--neon-purple);
            overflow: hidden;
        }

        canvas { 
            background-color: #000; 
            border: 3px solid var(--neon-glow); 
            border-radius: 6px;
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 56vh;
            display: none; 
            image-rendering: pixelated;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            object-fit: contain;
        }
        
        /* MENU STYLES */
        #menu-screen, #instructions-screen, #gameover-screen {
            width: 100%;
            max-width: 800px;
            min-height: 490px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 15px 12px;
            background: linear-gradient(180deg, rgba(36, 0, 70, 0.95) 0%, rgba(16, 0, 43, 0.98) 100%);
            border-radius: 8px;
        }
        
        /* MODERN GLASSMORPHIC LANGUAGE SELECTOR */
        .lang-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(216, 0, 255, 0.4);
            box-shadow: 0 0 15px rgba(216, 0, 255, 0.2);
            margin-bottom: 6px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 0, 43, 0.6);
            color: #e0aaff;
            border: 1.5px solid rgba(138, 43, 226, 0.5);
            padding: 6px 14px;
            font-size: 1.05em;
            font-family: inherit;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-btn:hover {
            border-color: #fff;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 12px var(--neon-purple);
        }

        .lang-btn.active {
            background: linear-gradient(135deg, rgba(216, 0, 255, 0.8), rgba(123, 44, 191, 0.9));
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 18px var(--neon-purple);
            font-weight: bold;
        }

        .flag-icon {
            width: 24px;
            height: 16px;
            border-radius: 3px;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        
        .menu-section {
            width: 100%;
            text-align: center;
            margin-bottom: 6px;
            background: rgba(60, 9, 108, 0.3);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(216, 0, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        .menu-title {
            color: var(--neon-bright);
            font-size: 1.5em;
            margin-bottom: 6px;
            text-shadow: 0 0 8px var(--neon-glow);
            letter-spacing: 2px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: #10002b;
            color: #e0aaff;
            border: 2px solid var(--neon-glow);
            padding: 8px 14px;
            font-size: 1.1em;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.3);
        }
        .btn:hover { 
            background: var(--neon-glow); 
            color: #fff; 
            border-color: #fff;
            box-shadow: 0 0 15px var(--neon-purple);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn.active { 
            background: linear-gradient(135deg, #7b2cbf, #d800ff); 
            color: #fff; 
            border-color: #fff; 
            box-shadow: 0 0 15px var(--neon-purple);
            font-weight: bold;
        }

        .char-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
            gap: 4px;
            width: 110px;
        }
        .char-portrait {
            width: 70px;
            height: 70px;
            background: #000;
            border: 3px solid var(--neon-bright);
            border-radius: 8px;
            image-rendering: pixelated;
            display: block;
            box-shadow: inset 0 0 10px rgba(216, 0, 255, 0.5);
        }

        #btn-start, #btn-accept, #btn-restart {
            margin-top: 8px;
            font-size: 1.5em;
            padding: 8px 30px;
            background: linear-gradient(135deg, #ffeb3b, #ff9800);
            color: #000;
            border: 2px solid #fff;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.6);
            animation: pulseBtn 1.5s infinite alternate;
        }
        #btn-start:hover, #btn-accept:hover, #btn-restart:hover {
            background: #fff; 
            color: #000;
            border-color: var(--neon-purple); 
            box-shadow: 0 0 25px #fff;
        }

        @keyframes pulseBtn { 
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 235, 59, 0.6); } 
            100% { transform: scale(1.04); box-shadow: 0 0 25px rgba(255, 235, 59, 0.9); } 
        }

        /* INSTRUCTIONS */
        #instructions-text {
            font-size: 1.15em;
            line-height: 1.4;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            border: 2px dashed var(--neon-purple);
            border-radius: 10px;
            padding: 12px;
            margin-top: 8px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(138, 43, 226, 0.3);
        }

        /* IN-GAME UI */
        #ui { 
            display: none; 
            width: 100%;
            max-width: 800px; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 3px; 
            font-size: 1.2em;
            background: rgba(24, 0, 40, 0.9);
            padding: 6px 12px;
            border: 2px solid var(--neon-purple);
            border-radius: 8px;
            box-sizing: border-box;
            color: #fff;
            box-shadow: 0 0 12px rgba(138, 43, 226, 0.4);
            flex-shrink: 0;
        }
        .bar-container { 
            width: 140px; 
            background: #000; 
            border: 2px solid #fff; 
            border-radius: 10px;
            height: 18px; 
            position: relative; 
            display: inline-block;
            vertical-align: middle;
            margin-left: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }
        #urge-bar { 
            width: 0%; 
            background: #4caf50; 
            height: 100%; 
            transition: width 0.1s, background-color 0.3s; 
            box-shadow: 0 0 8px currentColor;
        }
        
        /* Controles Móviles */
        .mobile-controls {
            display: none;
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 140px;
            margin-top: 2px;
            flex-shrink: 0;
        }
        
        #dpad {
            position: absolute;
            left: 15px;
            bottom: 35px;
            width: 110px;
            height: 110px;
        }
        .dpad-btn {
            position: absolute;
            background: #240046; 
            border: 2px solid var(--neon-purple);
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.4);
        }
        .dpad-btn:active { background: var(--neon-glow); color: #fff; }
        #btn-up { top: 0; left: 36px; width: 38px; height: 38px; }
        #btn-down { bottom: 0; left: 36px; width: 38px; height: 38px; }
        #btn-left { top: 36px; left: 0; width: 38px; height: 38px; }
        #btn-right { top: 36px; right: 0; width: 38px; height: 38px; }

        #action-btn {
            position: absolute;
            right: 15px;
            bottom: 42px;
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #ff5722, #d84315);
            border: 3px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 0 15px rgba(255, 87, 34, 0.6);
            line-height: 1.1;
            font-family: inherit;
        }
        #action-btn:active { background: #d84315; transform: scale(0.92); }

        /* STRICT MOBILE FULLSCREEN - ELEVATED CONTROLS LAYOUT */
        @media (max-width: 650px) {
            body {
                padding: 0;
                margin: 0;
                justify-content: space-between;
                height: 100dvh;
                width: 100vw;
                overflow: hidden;
            }
            #game-wrapper {
                border-radius: 0;
                border: none;
                width: 100vw;
                height: 100dvh;
                max-width: 100vw;
                justify-content: space-between;
                box-shadow: none;
                background: transparent;
            }
            #menu-screen, #instructions-screen, #gameover-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100dvh;
                min-height: 100dvh;
                z-index: 100;
                padding: 12px 8px;
                border-radius: 0;
                justify-content: space-evenly;
                overflow-y: auto;
            }
            #ui { 
                flex-direction: row; 
                align-items: center; 
                justify-content: space-between;
                font-size: 0.9em; 
                padding: 4px 8px; 
                margin-bottom: 2px; 
                border-radius: 0;
                border-x: none;
            }
            .bar-container { width: 100px; height: 14px; }
            .menu-game-title { font-size: 1.8em; margin-bottom: 6px; letter-spacing: 2px; }
            .btn { padding: 5px 8px; font-size: 0.85em; }
            .char-btn { width: 80px; padding: 3px; }
            .char-portrait { width: 50px; height: 50px; }
            .menu-title { font-size: 1.2em; margin-bottom: 3px; }
            .menu-section { padding: 5px; margin-bottom: 3px; }
            #instructions-text { font-size: 1.0em; padding: 8px; }

            canvas { 
                width: 100vw;
                max-width: 100vw;
                height: auto;
                max-height: calc(100dvh - 200px);
                border-width: 2px; 
                border-radius: 0;
                flex: 1;
                min-height: 0;
            }

            .mobile-controls {
                display: block;
                height: 140px;
                margin-bottom: 25px;
            }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div><span id="score-label">TRABAJOS</span>: <span id="score" style="color:#ffeb3b; font-weight:bold;">0</span></div>
        <div>
            <span id="urge-label">GANAS DE FUMAR</span>:
            <div class="bar-container"><div id="urge-bar"></div></div>
        </div>
    </div>
    
    <div id="game-wrapper">
        <!-- MENU SCREEN -->
        <div id="menu-screen">
            <!-- PROMINENT GAME TITLE -->
            <h1 class="menu-game-title">SMOKING SIMULATOR</h1>

            <!-- RETRO CIGARETTE BANNER -->
            <div class="cigarette-banner" id="cigarette-banner">
                <svg viewBox="0 0 180 45" width="140" height="34">
                    <defs>
                        <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <!-- Cigarette Body -->
                    <rect x="25" y="16" width="105" height="13" rx="2" fill="#f8f9fa" stroke="#d800ff" stroke-width="2" filter="url(#neon-glow)"/>
                    <!-- Orange Filter -->
                    <rect x="25" y="16" width="32" height="13" fill="#ff9800" stroke="#d800ff" stroke-width="2"/>
                    <line x1="33" y1="16" x2="33" y2="29" stroke="#e65100" stroke-width="1.5"/>
                    <line x1="41" y1="16" x2="41" y2="29" stroke="#e65100" stroke-width="1.5"/>
                    <!-- Burning Tip -->
                    <rect x="122" y="16" width="8" height="13" fill="#ff3d00" filter="url(#neon-glow)"/>
                    <circle cx="126" cy="22" r="2.5" fill="#ffeb3b"/>
                    <!-- Smoke Puffs -->
                    <path class="smoke-1" d="M 133 16 Q 142 8 138 2 T 145 -6" fill="none" stroke="#e0aaff" stroke-width="2.5" stroke-linecap="round"/>
                    <path class="smoke-2" d="M 136 18 Q 148 12 143 5 T 150 -2" fill="none" stroke="#e0aaff" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- MODERN GLASSMORPHIC LANGUAGE SELECTOR -->
            <div class="lang-bar">
                <button class="lang-btn active" onclick="playSfx('click'); setLang('es')" id="btn-lang-es">
                    <svg class="flag-icon" viewBox="0 0 30 20">
                        <rect width="30" height="20" rx="3" fill="#c60b1e"/>
                        <rect y="5" width="30" height="10" fill="#ffc400"/>
                        <circle cx="9" cy="10" r="2" fill="#c60b1e"/>
                    </svg>
                    <span>ESPAÑOL</span>
                </button>
                <button class="lang-btn" onclick="playSfx('click'); setLang('en')" id="btn-lang-en">
                    <svg class="flag-icon" viewBox="0 0 30 20">
                        <clipPath id="uk-clip"><rect width="30" height="20" rx="3"/></clipPath>
                        <g clip-path="url(#uk-clip)">
                            <rect width="30" height="20" fill="#012169"/>
                            <path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="4"/>
                            <path d="M0,0 L30,20 M30,0 L0,20" stroke="#C8102E" stroke-width="2.2"/>
                            <path d="M15,0 V20 M0,10 H30" stroke="#fff" stroke-width="6"/>
                            <path d="M15,0 V20 M0,10 H30" stroke="#C8102E" stroke-width="3.2"/>
                        </g>
                    </svg>
                    <span>ENGLISH</span>
                </button>
            </div>

            <div class="menu-section">
                <div class="menu-title" id="txt-choose-char">ELIGE PERSONAJE</div>
                <div class="btn-group">
                    <button class="btn char-btn active" onclick="playSfx('click'); setChar('alpes')" id="btn-char-alpes">
                        <canvas class="char-portrait" id="port-alpes" width="100" height="100"></canvas>
                        ALPES
                    </button>
                    <button class="btn char-btn" onclick="playSfx('click'); setChar('lentxo')" id="btn-char-lentxo">
                        <canvas class="char-portrait" id="port-lentxo" width="100" height="100"></canvas>
                        LENTXO
                    </button>
                    <button class="btn char-btn" onclick="playSfx('click'); setChar('mane')" id="btn-char-mane">
                        <canvas class="char-portrait" id="port-mane" width="100" height="100"></canvas>
                        MAÑE
                    </button>
                </div>
            </div>

            <div class="menu-section">
                <div class="menu-title" id="txt-choose-diff">DIFICULTAD</div>
                <div class="btn-group">
                    <button class="btn active" onclick="playSfx('click'); setDiff('easy')" id="btn-diff-easy">FÁCIL</button>
                    <button class="btn" onclick="playSfx('click'); setDiff('mod')" id="btn-diff-mod">MODERADO</button>
                    <button class="btn" onclick="playSfx('click'); setDiff('ext')" id="btn-diff-ext">ADICTO EXTREMO</button>
                </div>
            </div>

            <button class="btn" id="btn-start" onclick="playSfx('click'); showInstructions()">CONTINUAR</button>
        </div>

        <!-- INSTRUCTIONS SCREEN -->
        <div id="instructions-screen" style="display:none;">
            <h2 class="menu-title" style="font-size:2.1em; color:#ffeb3b; text-shadow:0 0 10px #ffeb3b;" id="txt-inst-title">INSTRUCCIONES</h2>
            <div id="instructions-text"></div>
            <button class="btn" id="btn-accept" onclick="playSfx('click'); startGame()">ACEPTAR</button>
        </div>

        <!-- GAMEOVER SCREEN -->
        <div id="gameover-screen" style="display:none; justify-content:center;">
            <h1 id="go-title" style="color:#ff0055; font-size:3.8em; margin:0; text-shadow:0 0 20px #ff0055;">GAME OVER</h1>
            <h2 id="go-reason" style="color:#fff; font-size:1.6em; margin-top:12px; text-shadow: 0 0 10px rgba(255,255,255,0.5);"></h2>
            <h3 id="go-score" style="color:#00ffff; font-size:2.0em; margin-top:12px; text-shadow:0 0 10px #00ffff;"></h3>
            <button class="btn" id="btn-restart" onclick="playSfx('click'); goToMenu()">INTENTARLO DE NUEVO</button>
        </div>

        <!-- THE GAME -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    
    <!-- MOBILE CONTROLS -->
    <div class="mobile-controls" id="mobile-controls">
        <div id="dpad">
            <div id="btn-up" class="dpad-btn">▲</div>
            <div id="btn-down" class="dpad-btn">▼</div>
            <div id="btn-left" class="dpad-btn">◀</div>
            <div id="btn-right" class="dpad-btn">▶</div>
        </div>
        <div id="action-btn">ACCIÓN</div>
    </div>

    <script>
        // --- 8-BIT RETRO AUDIO SYNTHESIZER ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSfx(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'step') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.04);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (type === 'work') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300 + Math.random() * 200, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'item') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'relieve') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150 + Math.random() * 50, now);
                    osc.frequency.linearRampToValueAtTime(300 + Math.random() * 50, now + 0.08);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'complete') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.6);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'warn') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(500, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch(e) {}
        }

        // --- MAÑE LOGIC ---
        function spawnPerson() {
            let attempts = 0;
            const maxX = isMobileLayout ? 500 : 520;
            const maxY = isMobileLayout ? 460 : 480;

            while(attempts < 100) {
                let p = { 
                    x: 40 + Math.random()*maxX, 
                    y: 60 + Math.random()*maxY, 
                    w: 30, h: 40, 
                    color: getRandomColor('mane'), 
                    type: 'person' 
                };
                let safe = true;
                walls.forEach(w => { if(rectIntersect(p, {x:w.x-20, y:w.y-20, w:w.w+40, h:w.h+40})) safe = false; });
                if (rectIntersect(p, smokingZone)) safe = false;
                desks.forEach(d => { if(rectIntersect(p, {x:d.x-20, y:d.y-20, w:d.w+40, h:d.h+40})) safe = false; });
                if (rectIntersect(p, {x: player.x-50, y: player.y-50, w: 130, h: 140})) safe = false;
                
                if (safe) { desks.push(p); break; }
                attempts++;
            }
        }

        function startGame() {
            getAudioContext();
            setupLayout();
            screens.inst.style.display = 'none';
            
            screens.canvas.style.display = 'block';
            screens.ui.style.display = 'flex';
            
            if (isTouchDevice || isMobileLayout) {

            document.getElementById('urge-label').innerText = d[currentChar + '_urge'];

            score = 0; urge = 0; gameOver = false;
            player.x = isMobileLayout ? 280 : 300; 
            player.y = isMobileLayout ? 480 : 500;
            
            player.speed = (currentChar === 'lentxo') ? 360 : 270;

            activeDeskIndex = -1; taskDelay = 1.0; itemObj.active = false;
            keys = {}; isActionPressed = false;

            if (currentDiff === 'easy') { urgeSpeed = 2.1; maxTaskTime = 30; timeReduction = 1.0; }
            else if (currentDiff === 'mod') { urgeSpeed = 3.6; maxTaskTime = 20; timeReduction = 1.3; }
            else if (currentDiff === 'ext') { urgeSpeed = 6.0; maxTaskTime = 20; timeReduction = 1.3; }

            if (currentChar === 'alpes') {
                canvas.style.borderColor = "#1e88e5"; document.getElementById('ui').style.borderColor = "#1e88e5";
            } else if (currentChar === 'lentxo') {
                canvas.style.borderColor = "#ff9800"; document.getElementById('ui').style.borderColor = "#ff9800";
            } else {
                canvas.style.borderColor = "#00ffff"; document.getElementById('ui').style.borderColor = "#00ffff";
            }

            desks = [];
            if (currentChar === 'mane') {
                for(let i=0; i<6; i++) spawnPerson();
            } else {
                // 9 MAQUINAS / MESAS EN MATRIZ 3x3
                const gymMachines = ['bench', 'treadmill', 'squat', 'dumbbells', 'pullup', 'legpress', 'bag', 'rowing', 'bike'];
                for (let i = 0; i < 9; i++) {
                    let col = i % 3;
                    let row = Math.floor(i / 3);
                    let x, y;
                    if (isMobileLayout) {
                        x = 40 + col * 200;
                        y = 50 + row * 150;
                    } else {
                        x = 50 + col * 190;
                        y = 60 + row * 160;
                    }
                    let type = (currentChar === 'lentxo') ? gymMachines[i] : 'desk';
                    desks.push({ x, y, w: isMobileLayout ? 90 : 100, h: isMobileLayout ? 55 : 60, color: getRandomColor(currentChar), type });
                }
            }

            lastTime = performance.now();
            gameLoopId = requestAnimationFrame(loop);
        }

        function getRandomColor(char) {
            if (char === 'alpes') return '#1e88e5'; 
            if (char === 'mane') {
                const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff5252', '#69f0ae', '#ff9800']; 
                return colors[Math.floor(Math.random() * colors.length)];
            }
            return '#424242'; 
        }

        window.addEventListener('keydown', e => { getAudioContext(); keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        const bindBtn = (id, key) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); getAudioContext(); keys[key] = true; }, {passive: false});
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('touchcancel', (e) => { e.preventDefault(); keys[key] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); getAudioContext(); keys[key] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindBtn('btn-up', 'ArrowUp'); bindBtn('btn-down', 'ArrowDown');
        bindBtn('btn-left', 'ArrowLeft'); bindBtn('btn-right', 'ArrowRight');
        
        const abtn = document.getElementById('action-btn');
        if (abtn) {
            abtn.addEventListener('touchstart', (e) => { e.preventDefault(); getAudioContext(); isActionPressed = true; }, {passive: false});
            abtn.addEventListener('touchend', (e) => { e.preventDefault(); isActionPressed = false; });
            abtn.addEventListener('touchcancel', (e) => { e.preventDefault(); isActionPressed = false; });
            abtn.addEventListener('mousedown', (e) => { e.preventDefault(); getAudioContext(); isActionPressed = true; });
            abtn.addEventListener('mouseup', (e) => { e.preventDefault(); isActionPressed = false; });
        }

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        function update(dt) {
            if (gameOver) return;

            let dx = 0, dy = 0;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) dy = -player.speed * dt;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) dy = player.speed * dt;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx = -player.speed * dt;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) dx = player.speed * dt;

            if (dx !== 0 || dy !== 0) {
                stepAudioTimer += dt * 60;
                if (stepAudioTimer >= 12) { playSfx('step'); stepAudioTimer = 0; }
            }

            player.w = (currentChar === 'lentxo') ? 40 : 30;
            const solidObjects = [...walls, ...desks];

            player.x += dx;
            solidObjects.forEach(obj => { if (obj.type !== 'knocked_out' && rectIntersect(player, obj)) player.x -= dx; });
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            player.y += dy;
            solidObjects.forEach(obj => { if (obj.type !== 'knocked_out' && rectIntersect(player, obj)) player.y -= dy; });
            if (player.y < 0) player.y = 0;
            if (player.y + player.h > canvas.height) player.y = canvas.height - player.h;

            if (currentChar !== 'mane' && !itemObj.active && Math.random() < 0.003 * dt * 60) {
                itemObj.x = 40 + Math.random() * (isMobileLayout ? 480 : 520);
                itemObj.y = 40 + Math.random() * (isMobileLayout ? 450 : 500);
                itemObj.w = 20; itemObj.h = 20;
                let collision = false;
                solidObjects.forEach(obj => { if (obj.type !== 'knocked_out' && rectIntersect(itemObj, obj)) collision = true; });
                if (!collision) itemObj.active = true;
            }

            if (itemObj.active && rectIntersect(player, itemObj)) {
                taskTimeLeft += 5;
                itemObj.active = false;
                playSfx('item');
            }

            if (activeDeskIndex === -1) {
                taskDelay -= dt;
                if (taskDelay <= 0) {
                    let available = desks.map((d, idx) => ({d, idx})).filter(item => item.d.type !== 'knocked_out');
                    if (available.length > 0) {
                        let chosen = available[Math.floor(Math.random() * available.length)];
                        activeDeskIndex = chosen.idx;
                        taskTimeLeft = maxTaskTime; taskProgress = 0;
                        playSfx('warn');
                    }
                }
            } else {
                taskTimeLeft -= dt;
                if (taskTimeLeft < maxTaskTime * 0.25) {
                    warnAudioTimer += dt * 60;
                    if (warnAudioTimer >= 20) { playSfx('warn'); warnAudioTimer = 0; }
                }
                if (taskTimeLeft <= 0) { 
                    gameOver = true; 
                    failReason = 'DESPEDIDO'; 
                    playSfx('gameover');
                }
            }

            let atActiveDesk = false;
            if (activeDeskIndex !== -1 && desks[activeDeskIndex]) {
                let d = desks[activeDeskIndex];
                if (rectIntersect(player, {x: d.x-25, y: d.y-25, w: d.w+50, h: d.h+50})) atActiveDesk = true;
            }

            let outside = rectIntersect(player, smokingZone);
            let actionActive = keys[' '] || isActionPressed;
            interacting = false; relieving = false;

            if (actionActive) {
                if (atActiveDesk) {
                    taskProgress += 72 * dt; interacting = true; 
                    if (Math.random() < 0.3 * dt * 60) playSfx('work');
                    if (taskProgress >= 100) {
                        score += 1; 
                        playSfx('complete');
                        if (desks[activeDeskIndex].type === 'person') {
                            desks[activeDeskIndex].type = 'knocked_out';
                            spawnPerson();
                            let bodies = desks.filter(d => d.type === 'knocked_out');
                            if (bodies.length > 12) {
                                let oldestIndex = desks.findIndex(d => d.type === 'knocked_out');
                                if (oldestIndex > -1) desks.splice(oldestIndex, 1);
                            }
                        }
                        activeDeskIndex = -1; taskDelay = Math.random() * 1.0 + 1.0; 
                        maxTaskTime -= timeReduction; 
                        if (maxTaskTime < MIN_TASK_TIME) maxTaskTime = MIN_TASK_TIME;
                    }
                } else if (outside) {
                    urge -= 30 * dt; if (urge < 0) urge = 0; relieving = true;
                    if (Math.random() < 0.2 * dt * 60) playSfx('relieve');
                }
            }

            if (!relieving) urge += urgeSpeed * dt; 
            if (urge >= 100) { 
                urge = 100; 
                gameOver = true; 
                failReason = 'TABACO'; 
                playSfx('gameover');
            }

            document.getElementById('score').innerText = score;
            const bar = document.getElementById('urge-bar');
            bar.style.width = urge + '%';
            if(urge > 75) bar.style.backgroundColor = '#ff0000';
            else if(urge > 50) bar.style.backgroundColor = '#ffeb3b';
            else bar.style.backgroundColor = '#4caf50';
        }

        // --- ENHANCED PIXEL ART DRAWING FUNCTIONS ---
        function drawChar(ctx, c, px, py, isInteracting, isRelieving, currentUrge) {
            const w = (c === 'lentxo') ? 40 : 30; 
            
            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.beginPath(); 
            ctx.ellipse(px + w/2, py + 38, w/2, 5, 0, 0, Math.PI*2); 
            ctx.fill();

            const bounce = (isInteracting || isRelieving) ? Math.sin(Date.now() / 80) * 1.5 : Math.sin(Date.now() / 250) * 0.5;

            if (c === 'lentxo') {
                ctx.fillStyle = '#222'; 
                ctx.beginPath(); ctx.arc(px + 4, py + 26 + bounce, 11, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w - 4, py + 26 + bounce, 11, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(px + 4, py + 26 + bounce, 9, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(px + w - 4, py + 26 + bounce, 9, 0, Math.PI*2); ctx.stroke();

                ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(px + 8, py + 14 + bounce); ctx.lineTo(px + 8, py + 30 + bounce); ctx.lineTo(px + w - 8, py + 30 + bounce); ctx.stroke();

                ctx.fillStyle = '#ff9800'; ctx.fillRect(px + 10, py + 12 + bounce, w - 20, 16); 
                ctx.fillStyle = '#111'; ctx.fillRect(px + 8, py + 36, 5, 5); ctx.fillRect(px + w - 13, py + 36, 5, 5);
            } else {
                if (c === 'alpes') ctx.fillStyle = '#1e88e5'; 
                else if (c === 'mane') ctx.fillStyle = '#00ffff'; 
                else if (c === 'npc') ctx.fillStyle = '#ff9800'; 
                ctx.fillRect(px + 5, py + 15 + bounce, w-10, 24);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(px + 7, py + 17 + bounce, 4, 20);
            }
            
            // Head
            ctx.fillStyle = '#ffcc99'; ctx.beginPath(); ctx.arc(px + w/2, py + 10 + bounce, 11, 0, Math.PI*2); ctx.fill();
            
            // Hair / Cap
            ctx.fillStyle = '#3e2723'; 
            ctx.beginPath(); ctx.arc(px + w/2, py + 8 + bounce, 12, Math.PI*1.1, Math.PI*1.9); ctx.fill();
            ctx.fillRect(px + w/2 - 12, py + 2 + bounce, 24, 6);
            if (c === 'mane') { ctx.fillStyle = '#111'; ctx.fillRect(px + w/2 - 12, py + 14 + bounce, 24, 6); }

            // Eyes
            ctx.fillStyle = currentUrge > 75 ? '#ff0000' : '#ffffff';
            ctx.beginPath(); ctx.arc(px + w/2 - 4, py + 10 + bounce, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + w/2 + 4, py + 10 + bounce, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(px + w/2 - 4, py + 10 + bounce, 1.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + w/2 + 4, py + 10 + bounce, 1.2, 0, Math.PI*2); ctx.fill();

            // Mouth
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.beginPath();
            if (isRelieving) {
                if (c === 'mane') {
                    ctx.arc(px + w/2, py + 15 + bounce, 4, 0, Math.PI); ctx.stroke();
                    ctx.fillStyle = '#ffeb3b'; ctx.fillRect(px + w/2 + 4, py + 12 + bounce, 9, 14);
                    ctx.fillStyle = '#fff'; ctx.fillRect(px + w/2 + 4, py + 8 + bounce, 9, 4); 
                } else {
                    ctx.arc(px + w/2, py + 16 + bounce, 2, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.fillRect(px + w/2, py + 15 + bounce, 10, 2);
                    ctx.fillStyle = '#ff3d00'; ctx.fillRect(px + w/2 + 10, py + 15 + bounce, 2, 2);
                    if (Math.random() > 0.4) {
                        ctx.fillStyle = 'rgba(220, 220, 220, 0.6)'; ctx.beginPath();
                        ctx.arc(px + w/2 + 14 + Math.random()*6, py - 8 - Math.random()*15, 4+Math.random()*4, 0, Math.PI*2); ctx.fill();
                    }
                }
            } else if (currentUrge > 75) { 
                ctx.arc(px + w/2, py + 18 + bounce, 4, Math.PI, 0); ctx.stroke();
            } else { 
                ctx.arc(px + w/2, py + 15 + bounce, 4, 0, Math.PI); ctx.stroke(); 
            }

            if (isInteracting) {
                ctx.fillStyle = '#ffcc99';
                ctx.beginPath(); ctx.arc(px + 2, py + 25 + Math.sin(Date.now()/100)*3, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w - 2, py + 25 + Math.cos(Date.now()/100)*3, 4, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawPortraits() {
            ['alpes', 'lentxo', 'mane'].forEach(c => {
                const cvs = document.getElementById('port-' + c);
                if(cvs) {
                    const pCtx = cvs.getContext('2d'); pCtx.clearRect(0,0,100,100); pCtx.save();
                    const scale = (c==='lentxo') ? 1.6 : 1.8; pCtx.scale(scale, scale);
                    drawChar(pCtx, c, 12, 5, false, false, 0); pCtx.restore();
                }
            });
        }
        drawPortraits();

        function drawGymMachine(ctx, type, x, y, w, h) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; 
            ctx.fillRect(x + 5, y + 5, w, h); 
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
            
            switch(type) {
                case 'bench':
                    ctx.fillStyle = '#222'; ctx.fillRect(x+10, y+10, w-20, h-20); 
                    ctx.fillStyle = '#d32f2f'; ctx.fillRect(x+25, y+15, w-50, h-30); 
                    ctx.fillStyle = '#ff5252'; ctx.fillRect(x+27, y+17, w-54, 5);
                    ctx.fillStyle = '#666'; ctx.fillRect(x+15, y+5, 6, h-10); ctx.fillRect(x+w-21, y+5, 6, h-10); 
                    ctx.fillStyle = '#fff'; ctx.fillRect(x+10, y+22, w-20, 5); 
                    break;
                case 'treadmill':
                    ctx.fillStyle = '#111'; ctx.fillRect(x+15, y+5, w-30, h-10); 
                    ctx.fillStyle = '#333'; ctx.fillRect(x+20, y+10, w-40, h-20); 
                    ctx.fillStyle = '#ff9800'; ctx.fillRect(x+20, y+10, w-40, 2);
                    ctx.fillStyle = '#03a9f4'; ctx.fillRect(x+30, y+8, 20, 6); 
                    break;
                case 'squat':
                    ctx.fillStyle = '#777'; ctx.fillRect(x+12, y+5, 10, h-10); ctx.fillRect(x+w-22, y+5, 10, h-10); 
                    ctx.fillStyle = '#d32f2f'; ctx.fillRect(x+5, y+h-15, w-10, 8); 
                    ctx.fillStyle = '#fff'; ctx.fillRect(x+5, y+18, w-10, 5); 
                    break;
                case 'dumbbells':
                    ctx.fillStyle = '#333'; ctx.fillRect(x+5, y+12, w-10, h-24); 
                    ctx.fillStyle = '#222'; ctx.fillRect(x+5, y+22, w-10, 4); 
                    for(let i=0; i<4; i++) {
                        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x+15 + i*20, y+18, 5, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x+15 + i*20, y+32, 7, 0, Math.PI*2); ctx.fill();
                    }
                    break;
                case 'pullup':
                    ctx.fillStyle = '#222'; ctx.fillRect(x+15, y+10, w-30, h-20); 
                    ctx.fillStyle = '#d32f2f'; ctx.fillRect(x+15, y+10, 8, h-20); ctx.fillRect(x+w-23, y+10, 8, h-20); 
                    ctx.fillStyle = '#fff'; ctx.fillRect(x+8, y+10, w-16, 4); 
                    break;
                case 'legpress':
                    ctx.fillStyle = '#222'; ctx.fillRect(x+10, y+10, w-20, h-20); 
                    ctx.fillStyle = '#d32f2f'; ctx.fillRect(x+18, y+18, 18, 18);
                    break;
                case 'bag':
                    ctx.fillStyle = '#111'; ctx.fillRect(x+25, y+5, w-50, h-10); 
                    ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(x+w/2, y+h/2, 14, 0, Math.PI*2); ctx.fill(); 
                    break;
                case 'rowing':
                    ctx.fillStyle = '#333'; ctx.fillRect(x+5, y+22, w-10, 8); 
                    ctx.fillStyle = '#d32f2f'; ctx.fillRect(x+35, y+18, 18, 14); 
                    break;
                case 'bike':
                    ctx.fillStyle = '#333'; ctx.fillRect(x+15, y+h-12, w-30, 6);
                    ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(x+25, y+28, 12, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x+25, y+28, 8, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#aaa'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(x+25, y+28); ctx.lineTo(x+w-25, y+15); ctx.lineTo(x+w-20, y+12); ctx.stroke();
                    ctx.fillStyle = '#ff9800'; ctx.fillRect(x+w-35, y+15, 12, 5);
                    break;
            }
        }

        function drawTree(tx, ty) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(tx, ty + 30, 22, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#5d4037'; ctx.fillRect(tx - 7, ty, 14, 35); 
            ctx.fillStyle = '#1b5e20'; 
            ctx.beginPath(); ctx.arc(tx, ty - 10, 25, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#4caf50'; 
            ctx.beginPath(); ctx.arc(tx - 5, ty - 12, 10, 0, Math.PI*2); ctx.fill();
        }

        function drawStreetlight(sx, sy) {
            ctx.fillStyle = '#222'; ctx.fillRect(sx - 3, sy, 6, 45); 
            ctx.fillRect(sx - 15, sy - 4, 18, 5); 
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx - 10, sy - 2, 4, 0, Math.PI*2); ctx.fill(); 
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)'; ctx.beginPath(); ctx.arc(sx - 10, sy + 20, 30, 0, Math.PI*2); ctx.fill();
        }

        function draw() {
            if (currentChar === 'alpes') ctx.fillStyle = '#b0bec5'; 
            else if (currentChar === 'lentxo') ctx.fillStyle = '#111'; 
            else ctx.fillStyle = '#1a0a2a'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const maxXTile = isMobileLayout ? 600 : 640;
            const maxYTile = isMobileLayout ? 560 : 600;

            for(let i=0; i<maxXTile; i+=40) {
                for(let j=0; j<maxYTile; j+=40) {
                    if (currentChar === 'mane') {
                        if ((i/40 + j/40) % 2 === 0) ctx.fillStyle = '#2a0b45'; else ctx.fillStyle = '#110522';
                        ctx.fillRect(i, j, 40, 40);
                    } else if (currentChar === 'lentxo') {
                        if ((i/40 + j/40) % 2 === 0) ctx.fillStyle = '#2c2c2c'; else ctx.fillStyle = '#222'; 
                        ctx.fillRect(i, j, 40, 40);
                    } else {
                        if ((i/40 + j/40) % 2 === 0) ctx.fillStyle = '#eceff1'; else ctx.fillStyle = '#e0e6ed';
                        ctx.fillRect(i, j, 40, 40);
                        
                        ctx.strokeStyle = '#90a4ae';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(i + 0.5, j + 0.5, 39, 39);
                    }
                }
            }

            if (currentChar === 'mane') {
                ctx.fillStyle = '#ff00ff';
                ctx.shadowColor = '#ff00ff';
                ctx.shadowBlur = 15;
                ctx.font = 'bold 45px VT323'; ctx.textAlign = 'center';
                ctx.fillText('CLUB NEON', canvas.width / 2, 48);
                ctx.shadowBlur = 0;
            }

            // Draw Smoking Zone
            ctx.fillStyle = '#111'; 
            ctx.fillRect(smokingZone.x, smokingZone.y, smokingZone.w, smokingZone.h);
            
            if (currentChar === 'mane') {
                if (isMobileLayout) {
                    ctx.fillStyle = '#333'; ctx.fillRect(0, 600, 600, 100);
                    ctx.fillStyle = '#555'; ctx.fillRect(0, 560, 600, 25);
                    ctx.fillStyle = '#222';
                    for(let px=0; px<600; px+=40) { ctx.fillRect(px, 560, 2, 25); }

                    drawStreetlight(120, 610);
                    drawStreetlight(480, 610);

                    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(280, 560); ctx.quadraticCurveTo(290, 570, 280, 580); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(320, 560); ctx.quadraticCurveTo(310, 570, 320, 580); ctx.stroke();
                } else {
                    ctx.fillStyle = '#333'; ctx.fillRect(680, 0, 120, 600);
                    ctx.fillStyle = '#555'; ctx.fillRect(650, 0, 30, 600);
                    ctx.fillStyle = '#222';
                    for(let py=0; py<600; py+=40) { ctx.fillRect(650, py, 30, 2); }

                    drawStreetlight(700, 120);
                    drawStreetlight(700, 450);

                    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(650, 240); ctx.quadraticCurveTo(660, 250, 670, 240); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(650, 360); ctx.quadraticCurveTo(660, 350, 670, 360); ctx.stroke();
                }
            } else {
                if (isMobileLayout) {
                    ctx.fillStyle = '#4caf50'; ctx.fillRect(0, 560, 600, 140); 
                    ctx.fillStyle = '#9e9e9e'; ctx.fillRect(240, 560, 120, 70); 
                    drawTree(100, 610);
                    drawTree(500, 610);
                } else {
                    ctx.fillStyle = '#4caf50'; ctx.fillRect(650, 0, 150, 600); 
                    ctx.fillStyle = '#9e9e9e'; ctx.fillRect(650, 240, 80, 40); 
                    drawTree(730, 80);
                    drawTree(740, 480);
                    drawTree(690, 530);
                }
            }

            // Draw Walls and Exit Door
            ctx.fillStyle = '#333';
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.fillStyle = '#555';
                if (isMobileLayout) {
                    for(let x=w.x; x<w.x+w.w; x+=20) ctx.fillRect(x, w.y, 2, w.h);
                } else {
                    for(let y=w.y; y<w.y+w.h; y+=20) ctx.fillRect(w.x, y, w.w, 2);
                }
                ctx.fillStyle = '#333';
            });

            if (isMobileLayout) {
                ctx.fillStyle = '#d32f2f'; ctx.fillRect(220, 540, 160, 20); 
                ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
                ctx.fillText('E X I T', 300, 555);
            } else {
                ctx.fillStyle = '#d32f2f'; ctx.fillRect(630, 240, 20, 120); 
                ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
                ctx.fillText('E', 640, 265);
                ctx.fillText('X', 640, 290);
                ctx.fillText('I', 640, 315);
                ctx.fillText('T', 640, 340);
            }

            // Helper Items
            if (itemObj.active) {
                if (currentChar === 'alpes') {
                    ctx.fillStyle = '#9c27b0'; 
                    ctx.beginPath(); ctx.arc(itemObj.x+10, itemObj.y+12, 9, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(itemObj.x+1, itemObj.y+12); ctx.lineTo(itemObj.x+10, itemObj.y+2); ctx.lineTo(itemObj.x+19, itemObj.y+12); ctx.fill();
                    ctx.fillStyle = '#4caf50'; ctx.fillRect(itemObj.x+9, itemObj.y-2, 2, 6);
                } else if (currentChar === 'lentxo') {
                    ctx.fillStyle = '#ff5252'; ctx.beginPath(); ctx.arc(itemObj.x+5, itemObj.y+10, 6, Math.PI/2, Math.PI*1.5); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(itemObj.x+15, itemObj.y+10, 6, -Math.PI/2, Math.PI/2); ctx.fill();
                    ctx.fillRect(itemObj.x+5, itemObj.y+4, 10, 12);
                }
            }

            // Desks / Gym / Persons
            desks.forEach((d, i) => {
                if (d.type === 'knocked_out') {
                    ctx.save(); ctx.translate(d.x + d.w/2, d.y + d.h/2); ctx.rotate(Math.PI / 2); 
                    ctx.globalAlpha = 0.5; drawChar(ctx, 'npc', -15, -20, false, false, 0); 
                    ctx.fillStyle = d.color; ctx.fillRect(-10, -5, 20, 25); 
                    ctx.fillStyle = '#000'; ctx.font = '14px Arial'; ctx.textAlign = 'center'; ctx.fillText('x', -5, -8); ctx.fillText('x', 5, -8);
                    ctx.restore();
                } else if (d.type === 'person') {
                    drawChar(ctx, 'npc', d.x, d.y, false, false, 0); 
                    ctx.fillStyle = d.color; ctx.fillRect(d.x + 5, d.y + 15, 20, 25); 
                } else if (d.type === 'desk') {
                    // MESAS AZULES PARA ALPES
                    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(d.x + 5, d.y + 5, d.w, d.h); 
                    ctx.fillStyle = '#1e88e5'; ctx.fillRect(d.x, d.y, d.w, d.h);
                    ctx.fillStyle = '#0d47a1'; ctx.fillRect(d.x + 2, d.y + 2, d.w - 4, 4);
                    ctx.fillStyle = '#424242'; ctx.fillRect(d.x + 10, d.y + 10, 40, 22); 
                    ctx.fillStyle = '#bbdefb'; ctx.fillRect(d.x + 12, d.y + 12, 36, 18); 
                    ctx.fillStyle = '#00e676';
                    ctx.fillRect(d.x + 15, d.y + 14, 15, 2);
                    ctx.fillRect(d.x + 15, d.y + 18, 25, 2);
                    ctx.fillStyle = '#1565c0'; ctx.fillRect(d.x + 58, d.y + 18, 18, 18); 
                } else {
                    drawGymMachine(ctx, d.type, d.x, d.y, d.w, d.h);
                }

                if (i === activeDeskIndex && d.type !== 'knocked_out') {
                    let cx = d.x + d.w/2; let cy = d.y - 12;
                    ctx.fillStyle = (Math.floor(Date.now() / 250) % 2 === 0) ? '#ff5252' : '#ffeb3b';
                    ctx.font = 'bold 28px VT323'; ctx.textAlign = 'center'; ctx.fillText('❗', cx, cy);

                    ctx.fillStyle = '#111'; ctx.fillRect(cx - 35, cy + 3, 70, 7);
                    let timePct = Math.max(0, taskTimeLeft / maxTaskTime);
                    ctx.fillStyle = timePct > 0.3 ? '#00ffff' : '#ff5252'; ctx.fillRect(cx - 35, cy + 3, 70 * timePct, 7);

                    if (taskProgress > 0) {
                        ctx.fillStyle = '#111'; ctx.fillRect(cx - 35, d.y + d.h + 4, 70, 7);
                        ctx.fillStyle = '#ffeb3b'; ctx.fillRect(cx - 35, d.y + d.h + 4, 70 * (taskProgress/100), 7);
                    }
                }
            });

            drawChar(ctx, currentChar, player.x, player.y, interacting, relieving, urge);

            if (gameOver) {
                screens.canvas.style.display = 'none'; screens.ui.style.display = 'none';
                mobileControls.style.display = 'none';
                screens.gameover.style.display = 'flex';
                
                const d = DICT[currentLang];
                document.getElementById('go-reason').innerText = (failReason === 'TABACO') ? d.estallado : d.despedido;
                document.getElementById('go-score').innerText = d.scoreIs + score + " " + d[currentChar + '_score'];
            }
        }

        function loop(timestamp) {
            if (!gameOver) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.1) dt = 0.1;
                lastTime = timestamp;

                update(dt);
                draw();
                gameLoopId = requestAnimationFrame(loop);
            }
        }

        updateMenuText();

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado con éxito con el alcance:', registration.scope);
                    }, err => {
                        console.log('El registro del ServiceWorker falló:', err);
                    });
            });
        }
    </script>
</body>
</html>
