<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMOKING SIMULATOR - PRO ULTIMATE HD</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d800ff">
    <link rel="apple-touch-icon" href="icono_smoking_simulator.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap');
        
        :root {
            --neon-purple: #d800ff;
            --neon-dark-purple: #12002b;
            --neon-glow: #9d4edd;
            --neon-bright: #f0abfc;
            --arcade-yellow: #ffeb3b;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --glass-bg: rgba(18, 4, 38, 0.82);
            --glass-border: rgba(216, 0, 255, 0.45);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #05000c;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
        }

        body { 
            background-image: 
                radial-gradient(circle at 50% 30%, #2e0054 0%, #05000c 85%),
                linear-gradient(to bottom, rgba(216, 0, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 28px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            touch-action: none;
            padding: 6px;
        }

        /* NEON HEADING */
        .menu-game-title { 
            margin-top: 0; 
            margin-bottom: 4px; 
            color: #ffffff; 
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8em; 
            font-weight: 900;
            text-align: center; 
            text-shadow: 
                0 0 10px #fff,
                0 0 20px var(--neon-purple),
                0 0 40px var(--neon-purple),
                0 0 60px var(--neon-glow); 
            letter-spacing: 3px; 
            line-height: 1.0;
            animation: pulseTitle 2s infinite alternate ease-in-out;
        }

        @keyframes pulseTitle {
            0% { text-shadow: 0 0 8px #fff, 0 0 15px var(--neon-purple), 0 0 30px var(--neon-purple), 0 0 45px var(--neon-glow); transform: scale(1); }
            100% { text-shadow: 0 0 16px #fff, 0 0 25px var(--neon-purple), 0 0 50px var(--neon-purple), 0 0 80px var(--neon-glow), 0 0 100px #ff00ff; transform: scale(1.02); }
        }

        /* RETRO CIGARETTE BANNER */
        .cigarette-banner {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 12px var(--neon-purple));
        }

        @keyframes riseSmoke {
            0% { transform: translateY(0) translateX(0) scale(0.6); opacity: 0.85; }
            50% { transform: translateY(-16px) translateX(10px) scale(1.2); opacity: 0.5; }
            100% { transform: translateY(-32px) translateX(-8px) scale(1.6); opacity: 0; }
        }

        .smoke-1 { animation: riseSmoke 2.2s infinite ease-in-out; transform-origin: 135px 22px; }
        .smoke-2 { animation: riseSmoke 2.6s infinite ease-in-out 1.1s; transform-origin: 138px 20px; }
        
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 45px rgba(157, 78, 221, 0.45), inset 0 0 25px rgba(216, 0, 255, 0.2);
            border-radius: 18px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border);
            overflow: hidden;
            padding: 8px;
        }

        canvas { 
            background-color: #060110; 
            border: 2px solid var(--neon-glow); 
            border-radius: 12px;
            width: 100%;
            max-width: 820px;
            height: auto;
            max-height: 58vh;
            display: none; 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95), 0 0 20px rgba(157, 78, 221, 0.35);
            object-fit: contain;
        }
        
        /* MENU STYLES */
        #menu-screen, #instructions-screen, #gameover-screen {
            width: 100%;
            max-width: 840px;
            min-height: 520px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 18px;
            background: linear-gradient(180deg, rgba(28, 5, 52, 0.95) 0%, rgba(10, 2, 22, 0.98) 100%);
            border-radius: 14px;
        }
        
        /* LANGUAGE SELECTOR */
        .lang-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1.5px solid rgba(216, 0, 255, 0.4);
            box-shadow: 0 0 18px rgba(216, 0, 255, 0.2);
            margin-bottom: 6px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 0, 43, 0.7);
            color: #e0aaff;
            border: 2px solid rgba(157, 78, 221, 0.6);
            padding: 6px 14px;
            font-size: 1.1em;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-btn:hover {
            border-color: #fff;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 16px var(--neon-purple);
        }

        .lang-btn.active {
            background: linear-gradient(135deg, rgba(216, 0, 255, 0.85), rgba(123, 44, 191, 0.95));
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 20px var(--neon-purple);
        }

        .flag-icon {
            width: 24px;
            height: 16px;
            border-radius: 3px;
            box-shadow: 0 0 5px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }
        
        .menu-section {
            width: 100%;
            text-align: center;
            margin-bottom: 6px;
            background: rgba(45, 8, 80, 0.35);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1.5px solid rgba(216, 0, 255, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        
        .menu-title {
            color: var(--neon-bright);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3em;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 0 10px var(--neon-glow);
            letter-spacing: 2px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background: #140133;
            color: #f0abfc;
            border: 2px solid var(--neon-glow);
            padding: 10px 20px;
            font-size: 1.2em;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 0 12px rgba(157, 78, 221, 0.3);
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { 
            background: var(--neon-glow); 
            color: #fff; 
            border-color: #fff;
            box-shadow: 0 0 20px var(--neon-purple);
            transform: translateY(-2px);
        }
        .btn:active { transform: translateY(1px); }
        .btn.active { 
            background: linear-gradient(135deg, #9d4edd, #d800ff); 
            color: #fff; 
            border-color: #fff; 
            box-shadow: 0 0 22px var(--neon-purple), inset 0 0 10px rgba(255,255,255,0.4);
        }

        .char-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 12px;
            gap: 6px;
            width: 145px;
            min-height: 135px;
            border-radius: 14px;
            background: rgba(20, 2, 45, 0.85);
            border: 2px solid rgba(157, 78, 221, 0.5);
            transition: all 0.25s ease;
        }
        .char-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 22px rgba(0, 240, 255, 0.6);
            transform: translateY(-4px);
        }
        .char-btn.active {
            background: linear-gradient(145deg, rgba(157, 78, 221, 0.9), rgba(216, 0, 255, 0.95));
            border-color: #ffffff;
            box-shadow: 0 0 25px var(--neon-purple), 0 0 15px var(--accent-cyan);
            transform: scale(1.04);
        }

        .char-portrait {
            width: 85px;
            height: 85px;
            background: #000;
            border: 2px solid var(--neon-bright);
            border-radius: 10px;
            display: block;
            box-shadow: inset 0 0 12px rgba(216, 0, 255, 0.6), 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .char-btn.active .char-portrait {
            border-color: #ffffff;
            box-shadow: 0 0 14px #ffffff, inset 0 0 15px rgba(255, 235, 59, 0.5);
        }

        .char-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1em;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        #btn-start, #btn-accept, #btn-restart {
            margin-top: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4em;
            font-weight: 900;
            padding: 12px 42px;
            background: linear-gradient(135deg, #ffea00, #ff9100);
            color: #0b0117;
            border: 3px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 0 28px rgba(255, 234, 0, 0.7);
            animation: pulseBtn 1.5s infinite alternate ease-in-out;
            letter-spacing: 2px;
        }
        #btn-start:hover, #btn-accept:hover, #btn-restart:hover {
            background: #ffffff; 
            color: #000;
            border-color: var(--neon-purple); 
            box-shadow: 0 0 35px #ffffff, 0 0 22px var(--neon-purple);
            transform: scale(1.05);
        }

        @keyframes pulseBtn { 
            0% { transform: scale(1); box-shadow: 0 0 18px rgba(255, 234, 0, 0.6); } 
            100% { transform: scale(1.06); box-shadow: 0 0 32px rgba(255, 234, 0, 0.95); } 
        }

        /* INSTRUCTIONS */
        #instructions-container {
            width: 100%;
            max-width: 720px;
            background: rgba(10, 2, 26, 0.92);
            border: 2px solid var(--neon-purple);
            border-radius: 14px;
            padding: 16px 20px;
            margin-top: 6px;
            box-shadow: inset 0 0 25px rgba(157, 78, 221, 0.3), 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #instructions-text {
            font-size: 1.25em;
            line-height: 1.5;
            color: #ffffff;
            text-align: left;
        }

        .inst-header {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--arcade-yellow);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3em;
            font-weight: 800;
            margin-bottom: 12px;
            border-bottom: 2px dashed rgba(216, 0, 255, 0.5);
            padding-bottom: 8px;
        }

        .inst-item {
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .inst-badge {
            background: var(--neon-purple);
            color: #fff;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.85em;
            flex-shrink: 0;
            margin-top: 2px;
            box-shadow: 0 0 8px rgba(216,0,255,0.5);
        }

        .inst-highlight {
            color: var(--arcade-yellow);
            font-weight: 700;
            text-shadow: 0 0 6px rgba(255, 235, 59, 0.5);
        }

        .inst-green {
            color: var(--accent-green);
            font-weight: 700;
        }

        /* IN-GAME HUD */
        #ui { 
            display: none; 
            width: 100%;
            max-width: 820px; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 6px; 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1em;
            font-weight: 800;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 18px;
            border: 2px solid var(--neon-purple);
            border-radius: 12px;
            box-sizing: border-box;
            color: #fff;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
            flex-shrink: 0;
        }
        .bar-container { 
            width: 170px; 
            background: rgba(0, 0, 0, 0.8); 
            border: 2px solid #fff; 
            border-radius: 12px;
            height: 22px; 
            position: relative; 
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.9), 0 0 8px rgba(255,255,255,0.2);
        }
        #urge-bar { 
            width: 0%; 
            background: linear-gradient(90deg, #00ff88, #76ff03); 
            height: 100%; 
            transition: width 0.15s linear, background-color 0.3s; 
            box-shadow: 0 0 12px currentColor;
            border-radius: 10px;
        }
        
        /* Mobile Controls */
        .mobile-controls {
            display: none;
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 150px;
            margin-top: 4px;
            flex-shrink: 0;
        }
        
        #dpad {
            position: absolute;
            left: 15px;
            bottom: 20px;
            width: 130px;
            height: 130px;
        }
        .dpad-btn {
            position: absolute;
            background: radial-gradient(circle, #32005e 0%, #15002b 100%); 
            border: 2.5px solid var(--neon-purple);
            border-radius: 12px;
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 0 12px rgba(157, 78, 221, 0.5);
            transition: transform 0.1s, background 0.1s;
        }
        .dpad-btn:active { background: var(--neon-glow); color: #fff; transform: scale(0.92); }
        #btn-up { top: 0; left: 44px; width: 44px; height: 44px; }
        #btn-down { bottom: 0; left: 44px; width: 44px; height: 44px; }
        #btn-left { top: 44px; left: 0; width: 44px; height: 44px; }
        #btn-right { top: 44px; right: 0; width: 44px; height: 44px; }

        #action-btn {
            position: absolute;
            right: 15px;
            bottom: 25px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #ff5722 0%, #d84315 100%);
            border: 3.5px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 0 25px rgba(255, 87, 34, 0.8), inset 0 0 15px rgba(255,255,255,0.4);
            line-height: 1.2;
            transition: transform 0.1s;
        }
        #action-btn:active { background: #bf360c; transform: scale(0.90); }

        @media (max-width: 650px) {
            body { padding: 0; margin: 0; justify-content: space-between; height: 100dvh; width: 100vw; }
            #game-wrapper { border-radius: 0; border: none; width: 100vw; height: 100dvh; max-width: 100vw; padding: 0; background: transparent; backdrop-filter: none; }
            #menu-screen, #instructions-screen, #gameover-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; min-height: 100dvh; z-index: 100; padding: 12px 10px; border-radius: 0; justify-content: space-around; overflow-y: auto; }
            #ui { font-size: 0.95em; padding: 8px 12px; margin-bottom: 2px; border-radius: 0; border-left: none; border-right: none; }
            .bar-container { width: 120px; height: 18px; }
            .menu-game-title { font-size: 2.0em; margin-bottom: 2px; }
            .btn-group { gap: 8px; }
            .btn { padding: 8px 14px; font-size: 1.0em; min-height: 42px; }
            .char-btn { width: 110px; min-height: 118px; padding: 8px 6px; gap: 4px; }
            .char-portrait { width: 75px; height: 75px; }
            .char-name { font-size: 0.95em; }
            canvas { width: 100vw; max-width: 100vw; height: auto; max-height: calc(100dvh - 200px); border-width: 2px; border-radius: 0; flex: 1; min-height: 0; }
            .mobile-controls { display: block; height: 150px; margin-bottom: 12px; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div><span id="score-label">TRABAJOS</span>: <span id="score" style="color:#ffeb3b; font-weight:900;">0</span></div>
        <div>
            <span id="urge-label">GANAS DE FUMAR</span>:
            <div class="bar-container"><div id="urge-bar"></div></div>
        </div>
    </div>
    
    <div id="game-wrapper">
        <!-- MENU SCREEN -->
        <div id="menu-screen">
            <h1 class="menu-game-title">SMOKING SIMULATOR</h1>

            <div class="cigarette-banner" id="cigarette-banner">
                <svg viewBox="0 0 180 45" width="160" height="40">
                    <defs>
                        <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <rect x="25" y="16" width="105" height="13" rx="2" fill="#f8f9fa" stroke="#d800ff" stroke-width="2" filter="url(#neon-glow)"/>
                    <rect x="25" y="16" width="32" height="13" fill="#ff9800" stroke="#d800ff" stroke-width="2"/>
                    <line x1="33" y1="16" x2="33" y2="29" stroke="#e65100" stroke-width="1.5"/>
                    <line x1="41" y1="16" x2="41" y2="29" stroke="#e65100" stroke-width="1.5"/>
                    <rect x="122" y="16" width="8" height="13" fill="#ff3d00" filter="url(#neon-glow)"/>
                    <circle cx="126" cy="22" r="2.5" fill="#ffeb3b"/>
                    <path class="smoke-1" d="M 133 16 Q 142 8 138 2 T 145 -6" fill="none" stroke="#f0abfc" stroke-width="2.5" stroke-linecap="round"/>
                    <path class="smoke-2" d="M 136 18 Q 148 12 143 5 T 150 -2" fill="none" stroke="#f0abfc" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="lang-bar">
                <button class="lang-btn active" onclick="playSfx('click'); setLang('es')" id="btn-lang-es">
                    <svg class="flag-icon" viewBox="0 0 30 20">
                        <rect width="30" height="20" rx="3" fill="#c60b1e"/>
                        <rect y="5" width="30" height="10" fill="#ffc400"/>
                        <circle cx="9" cy="10" r="2" fill="#c60b1e"/>
                    </svg>
                    <span>ESPAÑOL</span>
                </button>
                <button class="lang-btn" onclick="playSfx('click'); setLang('en')" id="btn-lang-en">
                    <svg class="flag-icon" viewBox="0 0 30 20">
                        <clipPath id="uk-clip"><rect width="30" height="20" rx="3"/></clipPath>
                        <g clip-path="url(#uk-clip)">
                            <rect width="30" height="20" fill="#012169"/>
                            <path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="4"/>
                            <path d="M0,0 L30,20 M30,0 L0,20" stroke="#C8102E" stroke-width="2.2"/>
                            <path d="M15,0 V20 M0,10 H30" stroke="#fff" stroke-width="6"/>
                            <path d="M15,0 V20 M0,10 H30" stroke="#C8102E" stroke-width="3.2"/>
                        </g>
                    </svg>
                    <span>ENGLISH</span>
                </button>
            </div>

            <div class="menu-section">
                <div class="menu-title" id="txt-choose-char">ELIGE PERSONAJE</div>
                <div class="btn-group">
                    <button class="btn char-btn active" onclick="playSfx('click'); setChar('alpes')" id="btn-char-alpes">
                        <canvas class="char-portrait" id="port-alpes" width="120" height="120"></canvas>
                        <span class="char-name">ALPES</span>
                    </button>
                    <button class="btn char-btn" onclick="playSfx('click'); setChar('lentxo')" id="btn-char-lentxo">
                        <canvas class="char-portrait" id="port-lentxo" width="120" height="120"></canvas>
                        <span class="char-name">LENTXO</span>
                    </button>
                    <button class="btn char-btn" onclick="playSfx('click'); setChar('mane')" id="btn-char-mane">
                        <canvas class="char-portrait" id="port-mane" width="120" height="120"></canvas>
                        <span class="char-name">MAÑE</span>
                    </button>
                </div>
            </div>

            <div class="menu-section">
                <div class="menu-title" id="txt-choose-diff">DIFICULTAD</div>
                <div class="btn-group">
                    <button class="btn active" onclick="playSfx('click'); setDiff('easy')" id="btn-diff-easy">FÁCIL</button>
                    <button class="btn" onclick="playSfx('click'); setDiff('mod')" id="btn-diff-mod">MODERADO</button>
                    <button class="btn" onclick="playSfx('click'); setDiff('ext')" id="btn-diff-ext">ADICTO EXTREMO</button>
                </div>
            </div>

            <button class="btn" id="btn-start" onclick="playSfx('click'); showInstructions()">CONTINUAR</button>
        </div>

        <!-- INSTRUCTIONS SCREEN -->
        <div id="instructions-screen" style="display:none;">
            <h2 class="menu-title" style="font-size:2.2em; color:#ffeb3b; text-shadow:0 0 16px #ffeb3b;" id="txt-inst-title">INSTRUCCIONES</h2>
            <div id="instructions-container">
                <div id="instructions-text"></div>
            </div>
            <button class="btn" id="btn-accept" onclick="playSfx('click'); startGame()">ACEPTAR</button>
        </div>

        <!-- GAMEOVER SCREEN -->
        <div id="gameover-screen" style="display:none; justify-content:center;">
            <h1 id="go-title" style="color:#ff0055; font-family:'Orbitron', sans-serif; font-size:3.8em; margin:0; text-shadow:0 0 30px #ff0055;">GAME OVER</h1>

        // --- AUDIO SYNTHESIZER ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSfx(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.05);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'step') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(130, now);
                    osc.frequency.linearRampToValueAtTime(65, now + 0.04);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
                    osc.start(now); osc.stop(now + 0.04);
                } else if (type === 'work') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(320 + Math.random() * 220, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'item') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.07);
                    osc.frequency.setValueAtTime(784, now + 0.14);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now); osc.stop(now + 0.22);
                } else if (type === 'relieve') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(160 + Math.random() * 40, now);
                    osc.frequency.linearRampToValueAtTime(320 + Math.random() * 40, now + 0.08);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'complete') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(1046, now + 0.08);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.linearRampToValueAtTime(70, now + 0.6);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now); osc.stop(now + 0.6);
                } else if (type === 'warn') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(650, now);
                    osc.frequency.setValueAtTime(520, now + 0.08);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
                    osc.start(now); osc.stop(now + 0.14);
                }
            } catch(e) {}
        }

        // FX Systems
        let particles = [];
        let floatingTexts = [];

        function triggerShake(amt) { screenShake = Math.max(screenShake, amt); }

        function spawnParticle(x, y, color, size, vx, vy, life) {
            particles.push({ x, y, color, size, vx, vy, life, maxLife: life });
        }

        function spawnFloatingText(text, x, y, color) {
            floatingTexts.push({ text, x, y, color, life: 1.0, maxLife: 1.0, scale: 1.4 });
        }

        function updateFX(dt) {
            if (screenShake > 0) screenShake -= dt * 30;
            if (screenShake < 0) screenShake = 0;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt * 60;
                p.y += p.vy * dt * 60;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 28 * dt;
                ft.life -= dt;
                ft.scale = Math.max(1.0, ft.scale - dt * 2);
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
        }

        function drawFX(ctx) {
            particles.forEach(p => {
                let alpha = Math.max(0, p.life / p.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            floatingTexts.forEach(ft => {
                let alpha = Math.max(0, ft.life / ft.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = `900 ${Math.round(26 * ft.scale)}px 'Orbitron', sans-serif`;
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.shadowColor = ft.color;
                ctx.shadowBlur = 12;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });
        }

                    { x: 640, y: 0, w: 10, h: 250 },
                    { x: 640, y: 350, w: 10, h: 250 }
                ];
            }
            
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = displayW * dpr;
            canvas.height = displayH * dpr;
            canvas.style.width = displayW + 'px';
            canvas.style.height = displayH + 'px';
            ctx.scale(dpr, dpr);
            canvas.logicalWidth = displayW;
            canvas.logicalHeight = displayH;
        }

        window.addEventListener('resize', () => {
            setupLayout();
            drawPortraits();

        // --- MENU LOGIC ---
        function setLang(l) {

        function showInstructions() {
            screens.menu.style.display = 'none';
            screens.inst.style.display = 'flex';
            document.getElementById('instructions-text').innerHTML = DICT[currentLang][currentChar + '_inst'];

            screens.gameover.style.display = 'none';
            screens.canvas.style.display = 'none';
            screens.ui.style.display = 'none';

        function spawnPerson() {
            let attempts = 0;
            const maxX = isMobileLayout ? 500 : 520;
            const maxY = isMobileLayout ? 460 : 480;

            while(attempts < 100) {
                let p = { 
                    x: 40 + Math.random()*maxX, 
                    y: 80 + Math.random()*(maxY - 40), 
                    w: 34, h: 44, 
                    color: getRandomColor('mane'), 
                    type: 'person' 
                };
                let safe = true;
                walls.forEach(w => { if(rectIntersect(p, {x:w.x-20, y:w.y-20, w:w.w+40, h:w.h+40})) safe = false; });
                if (rectIntersect(p, smokingZone)) safe = false;
                desks.forEach(d => { if(rectIntersect(p, {x:d.x-20, y:d.y-20, w:d.w+40, h:d.h+40})) safe = false; });
                if (rectIntersect(p, {x: player.x-50, y: player.y-50, w: 130, h: 140})) safe = false;
                
                if (safe) { desks.push(p); break; }
                attempts++;
            }
        }

            getAudioContext();
            setupLayout();
            screens.inst.style.display = 'none';
            
            screens.canvas.style.display = 'block';

            lastTime = performance.now();

            abtn.addEventListener('touchcancel', (e) => { e.preventDefault(); isActionPressed = false; });
            abtn.addEventListener('mousedown', (e) => { e.preventDefault(); getAudioContext(); isActionPressed = true; });
            abtn.addEventListener('mouseup', (e) => { e.preventDefault(); isActionPressed = false; });
        }

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        function update(dt) {
            if (gameOver) return;

            updateFX(dt);

            let dx = 0, dy = 0;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) { dy = -player.speed * dt; player.facing = 'up'; }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) { dy = player.speed * dt; player.facing = 'down'; }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) { dx = -player.speed * dt; player.facing = 'left'; }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) { dx = player.speed * dt; player.facing = 'right'; }

            if (dx !== 0 || dy !== 0) {
                walkFrame += dt * 12;
                stepAudioTimer += dt * 60;
                if (stepAudioTimer >= 12) { playSfx('step'); stepAudioTimer = 0; }
                if (Math.random() < 0.2) {
                    spawnParticle(player.x + player.w/2, player.y + player.h - 2, 'rgba(255,255,255,0.2)', 2.5, (Math.random()-0.5)*0.6, 0.4, 0.3);
                }
            } else {
                walkFrame = 0;
            }

            player.w = (currentChar === 'lentxo') ? 44 : 34;
            const displayW = canvas.logicalWidth;
            const displayH = canvas.logicalHeight;

            const solidObjects = [...walls, ...desks];

            player.x += dx;
            solidObjects.forEach(obj => { if (obj.type !== 'knocked_out' && rectIntersect(player, obj)) player.x -= dx; });
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > displayW) player.x = displayW - player.w;

            player.y += dy;
            solidObjects.forEach(obj => { if (obj.type !== 'knocked_out' && rectIntersect(player, obj)) player.y -= dy; });
            if (player.y < 0) player.y = 0;
            if (player.y + player.h > displayH) player.y = displayH - player.h;

            if (currentChar !== 'mane' && !itemObj.active && Math.random() < 0.003 * dt * 60) {
                itemObj.x = 40 + Math.random() * (isMobileLayout ? 480 : 520);
                itemObj.y = 40 + Math.random() * (isMobileLayout ? 450 : 500);
                itemObj.w = 24; itemObj.h = 24;
                let collision = false;
                solidObjects.forEach(obj => { if (obj.type !== 'knocked_out' && rectIntersect(itemObj, obj)) collision = true; });
                if (!collision) itemObj.active = true;
            }

            if (itemObj.active && rectIntersect(player, itemObj)) {
                taskTimeLeft += 5;
                itemObj.active = false;
                playSfx('item');
                triggerShake(3);
                spawnFloatingText("+5 SEC!", player.x + 10, player.y - 15, "#ffea00");
                for (let i = 0; i < 8; i++) {
                    spawnParticle(player.x + 15, player.y + 15, '#ffeb3b', 4, (Math.random()-0.5)*3, (Math.random()-0.5)*3, 0.5);
                }
            }

            if (activeDeskIndex === -1) {
                taskDelay -= dt;
                if (taskDelay <= 0) {
                    let available = desks.map((d, idx) => ({d, idx})).filter(item => item.d.type !== 'knocked_out');
                    if (available.length > 0) {
                        let chosen = available[Math.floor(Math.random() * available.length)];
                        activeDeskIndex = chosen.idx;
                        taskTimeLeft = maxTaskTime; taskProgress = 0;
                        playSfx('warn');
                    }
                }
            } else {
                taskTimeLeft -= dt;
                if (taskTimeLeft < maxTaskTime * 0.25) {
                    warnAudioTimer += dt * 60;
                    if (warnAudioTimer >= 20) { playSfx('warn'); warnAudioTimer = 0; }
                }
                if (taskTimeLeft <= 0) { 
                    gameOver = true; 
                    failReason = 'DESPEDIDO'; 
                    playSfx('gameover');
                    triggerShake(12);
                }
            }

            let atActiveDesk = false;
            if (activeDeskIndex !== -1 && desks[activeDeskIndex]) {
                let d = desks[activeDeskIndex];
                if (rectIntersect(player, {x: d.x-25, y: d.y-25, w: d.w+50, h: d.h+50})) atActiveDesk = true;
            }

            let outside = rectIntersect(player, smokingZone);
            let actionActive = keys[' '] || isActionPressed;
            interacting = false; relieving = false;

            if (actionActive) {
                if (atActiveDesk) {
                    taskProgress += 75 * dt; interacting = true; 
                    if (Math.random() < 0.25 * dt * 60) playSfx('work');
                    
                    // NO SMOKE AT TASK WORK!

                    if (taskProgress >= 100) {
                        score += 1; 
                        playSfx('complete');
                        triggerShake(5);
                        
                        let label = currentChar === 'alpes' ? '+1 CHIP!' : (currentChar === 'lentxo' ? '+1 FIT!' : '+1 K.O.!');
                        spawnFloatingText(label, player.x + 10, player.y - 20, "#00ff88");

                        if (desks[activeDeskIndex].type === 'person') {
                            desks[activeDeskIndex].type = 'knocked_out';
                            spawnPerson();
                            let bodies = desks.filter(d => d.type === 'knocked_out');
                            if (bodies.length > 12) {
                                let oldestIndex = desks.findIndex(d => d.type === 'knocked_out');
                                if (oldestIndex > -1) desks.splice(oldestIndex, 1);
                            }
                        }
                        activeDeskIndex = -1; taskDelay = Math.random() * 1.0 + 1.0; 
                        maxTaskTime -= timeReduction; 
                        if (maxTaskTime < MIN_TASK_TIME) maxTaskTime = MIN_TASK_TIME;
                    }
                } else if (outside) {
                    urge -= 32 * dt; if (urge < 0) urge = 0; relieving = true;
                    if (Math.random() < 0.2 * dt * 60) playSfx('relieve');

                    if (currentChar === 'mane') {
                        // BEER DROPLETS / FOAM BUBBLES NEAR GLASS (NO SMOKE FROM MOUTH!)
                        if (Math.random() < 0.4) {
                            spawnParticle(player.x + 28, player.y + 22, '#ffea00', 2.5, (Math.random()-0.5)*0.8, 0.8, 0.4);
                        }
                    } else {
                        // CIGARETTE SMOKE FOR ALPES & LENTXO
                        spawnParticle(player.x + 22, player.y + 5, 'rgba(235,225,255,0.85)', 5.5, Math.random()*1.5 + 0.5, -1.6, 0.9);
                    }
                }
            }

            if (!relieving) urge += urgeSpeed * dt; 
            if (urge >= 100) { 
                urge = 100; 
                gameOver = true; 
                failReason = 'TABACO'; 
                playSfx('gameover');
                triggerShake(14);
            }

            document.getElementById('score').innerText = score;
            const bar = document.getElementById('urge-bar');
            bar.style.width = urge + '%';
            if(urge > 75) bar.style.background = 'linear-gradient(90deg, #ff0055, #ff5252)';
            else if(urge > 50) bar.style.background = 'linear-gradient(90deg, #ffea00, #ff9100)';
            else bar.style.background = 'linear-gradient(90deg, #00ff88, #76ff03)';
        }

        // --- ENHANCED GRAPHICS & CHARACTER ANIMATIONS ---
        function drawChar(ctx, c, px, py, isInteracting, isRelieving, currentUrge) {
            const w = (c === 'lentxo') ? 44 : 34; 
            const walkOffset = Math.sin(walkFrame) * 3;
            
            ctx.save();
            // Drop Shadow
            let gradShadow = ctx.createRadialGradient(px + w/2, py + 40, 2, px + w/2, py + 40, w/1.2);
            gradShadow.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
            gradShadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradShadow;
            ctx.beginPath(); ctx.ellipse(px + w/2, py + 40, w/1.3, 7, 0, 0, Math.PI*2); ctx.fill();

            const bounce = (isInteracting || isRelieving) ? Math.sin(Date.now() / 70) * 2.5 : Math.sin(Date.now() / 240) * 1.2;

            if (c === 'lentxo') {
                // WHEELCHAIR
                ctx.fillStyle = '#111'; 
                ctx.beginPath(); ctx.arc(px + 4, py + 28 + bounce, 13, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w - 4, py + 28 + bounce, 13, 0, Math.PI*2); ctx.fill();
                
                ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(px + 4, py + 28 + bounce, 10, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(px + w - 4, py + 28 + bounce, 10, 0, Math.PI*2); ctx.stroke();
                
                ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 1.8;
                ctx.beginPath(); ctx.arc(px + 4, py + 28 + bounce, 11.5, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(px + w - 4, py + 28 + bounce, 11.5, 0, Math.PI*2); ctx.stroke();

                ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3.5;
                ctx.beginPath(); 
                ctx.moveTo(px + 8, py + 14 + bounce); 
                ctx.lineTo(px + 8, py + 34 + bounce); 
                ctx.lineTo(px + w - 8, py + 34 + bounce); 
                ctx.stroke();

                ctx.fillStyle = '#ff9800'; ctx.fillRect(px + 8, py + 16 + bounce, w - 16, 14); 
                ctx.fillStyle = '#222'; ctx.fillRect(px + 7, py + 38, 7, 7); ctx.fillRect(px + w - 14, py + 38, 7, 7);
            } else {
                // BODY & ANIMATED LEGS
                ctx.fillStyle = '#1e293b'; 
                ctx.fillRect(px + 6 + walkOffset, py + 38 + bounce, 9, 5); 
                ctx.fillRect(px + w - 15 - walkOffset, py + 38 + bounce, 9, 5);

                ctx.fillStyle = '#0f172a'; 
                ctx.fillRect(px + 7 + walkOffset/2, py + 32 + bounce, 8, 8); 
                ctx.fillRect(px + w - 15 - walkOffset/2, py + 32 + bounce, 8, 8);

                if (c === 'alpes') {
                    let jacketGrad = ctx.createLinearGradient(px, py + 12, px + w, py + 34);
                    jacketGrad.addColorStop(0, '#1d4ed8'); jacketGrad.addColorStop(1, '#1e40af');
                    ctx.fillStyle = jacketGrad;
                    ctx.fillRect(px + 5, py + 14 + bounce, w-10, 24);
                    ctx.fillStyle = '#60a5fa'; ctx.fillRect(px + w/2 - 2, py + 14 + bounce, 4, 24); 
                    ctx.fillStyle = '#ffeb3b'; ctx.fillRect(px + 8, py + 18 + bounce, 4, 4); 
                } else if (c === 'mane') {
                    let maneGrad = ctx.createLinearGradient(px, py + 12, px + w, py + 34);
                    maneGrad.addColorStop(0, '#06b6d4'); maneGrad.addColorStop(1, '#0891b2');
                    ctx.fillStyle = maneGrad;
                    ctx.fillRect(px + 4, py + 14 + bounce, w-8, 24);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(px + 10, py + 14 + bounce, w-20, 24);
                    ctx.fillStyle = '#ffea00'; ctx.fillRect(px + w/2 - 3, py + 19 + bounce, 6, 3); 
                } else if (c === 'npc') {
                    ctx.fillStyle = '#ea580c'; 
                    ctx.fillRect(px + 5, py + 14 + bounce, w-10, 24);
                }
            }
            
            // HEAD & SKIN
            ctx.fillStyle = '#fbcfe8'; 
            ctx.beginPath(); ctx.arc(px + w/2, py + 10 + bounce, 12, 0, Math.PI*2); ctx.fill();
            
            // HAIR / STYLES
            if (c === 'alpes') {
                ctx.fillStyle = '#451a03'; 
                ctx.beginPath(); ctx.arc(px + w/2, py + 8 + bounce, 13, Math.PI*1.0, Math.PI*2.0); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.strokeRect(px + w/2 - 9, py + 8 + bounce, 7, 5);
                ctx.strokeRect(px + w/2 + 2, py + 8 + bounce, 7, 5);
                ctx.beginPath(); ctx.moveTo(px + w/2 - 2, py + 10 + bounce); ctx.lineTo(px + w/2 + 2, py + 10 + bounce); ctx.stroke();
            } else if (c === 'lentxo') {
                ctx.fillStyle = '#dc2626'; 
                ctx.fillRect(px + w/2 - 13, py + 4 + bounce, 26, 5);
                ctx.fillStyle = '#78350f'; 
                ctx.fillRect(px + w/2 - 12, py + 1 + bounce, 24, 4);
            } else if (c === 'mane') {
                ctx.fillStyle = '#0f172a'; 
                ctx.beginPath(); ctx.arc(px + w/2, py + 6 + bounce, 14, Math.PI*0.8, Math.PI*2.1); ctx.fill();
            } else {
                ctx.fillStyle = '#78350f';
                ctx.beginPath(); ctx.arc(px + w/2, py + 8 + bounce, 12.5, Math.PI*1.1, Math.PI*1.9); ctx.fill();
            }

            // EYES
            ctx.fillStyle = currentUrge > 75 ? '#ff0055' : '#ffffff';
            ctx.beginPath(); ctx.arc(px + w/2 - 4.5, py + 10.5 + bounce, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + w/2 + 4.5, py + 10.5 + bounce, 3, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath(); ctx.arc(px + w/2 - 4.5, py + 10.5 + bounce, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + w/2 + 4.5, py + 10.5 + bounce, 1.5, 0, Math.PI*2); ctx.fill();

            // MOUTH & DRINKING / SMOKING
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1.8; ctx.beginPath();
            if (isRelieving) {
                if (c === 'mane') {
                    // BEER DRINKING ANIMATION (NO SMOKE!)
                    ctx.arc(px + w/2, py + 15 + bounce, 3.5, 0, Math.PI); ctx.stroke();
                    // Glass of Beer held up to mouth
                    ctx.fillStyle = '#ffea00'; ctx.fillRect(px + w/2 + 4, py + 8 + bounce, 11, 15);
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(px + w/2 + 4, py + 5 + bounce, 11, 4.5); // Foam top
                    ctx.strokeStyle = '#d97706'; ctx.strokeRect(px + w/2 + 4, py + 8 + bounce, 11, 15);
                } else {
                    // SMOKING CIGARETTE
                    ctx.arc(px + w/2, py + 16 + bounce, 2, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(px + w/2, py + 15 + bounce, 12, 3);
                    ctx.fillStyle = '#ff3d00'; ctx.fillRect(px + w/2 + 12, py + 15 + bounce, 3.5, 3);
                }
            } else if (currentUrge > 75) { 
                ctx.arc(px + w/2, py + 18 + bounce, 5, Math.PI, 0); ctx.stroke();
            } else { 
                ctx.arc(px + w/2, py + 15 + bounce, 4, 0, Math.PI); ctx.stroke(); 
            }

            // --- ANIMATED ARMS (TASK / FIGHT / WORK ANIMATIONS) ---
            ctx.fillStyle = '#fbcfe8';
            let armTime = Date.now() / 60;

            if (isInteracting) {
                if (c === 'alpes') {
                    // TYPING ON KEYBOARD ANIMATION
                    let leftArmY = py + 22 + Math.sin(armTime * 2) * 3;
                    let rightArmY = py + 22 + Math.cos(armTime * 2) * 3;
                    ctx.beginPath(); ctx.arc(px - 1, leftArmY, 4.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px + w + 1, rightArmY, 4.5, 0, Math.PI*2); ctx.fill();
                } else if (c === 'lentxo') {
                    // EXERCISING / PUSHING ARMS
                    let liftArm = Math.abs(Math.sin(armTime * 1.5)) * 8;
                    ctx.beginPath(); ctx.arc(px - 2, py + 24 - liftArm, 5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px + w + 2, py + 24 - liftArm, 5, 0, Math.PI*2); ctx.fill();
                } else if (c === 'mane') {
                    // PUNCHING JABS ANIMATION
                    let punchLeft = Math.sin(armTime * 3) > 0 ? 12 : 0;
                    let punchRight = Math.sin(armTime * 3) <= 0 ? 12 : 0;
                    
                    // Red boxing glove / fist
                    ctx.fillStyle = '#dc2626';
                    ctx.beginPath(); ctx.arc(px - 2 + punchLeft, py + 22, 6, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px + w + 2 + punchRight, py + 22, 6, 0, Math.PI*2); ctx.fill();
                }
            } else if (!isRelieving) {
                // Resting arms
                ctx.beginPath(); ctx.arc(px + 1, py + 25 + bounce, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + w - 1, py + 25 + bounce, 4, 0, Math.PI*2); ctx.fill();
            }

            ctx.restore();
        }

        function drawPortraits() {
            ['alpes', 'lentxo', 'mane'].forEach(c => {
                const cvs = document.getElementById('port-' + c);
                if(cvs) {
                    const pCtx = cvs.getContext('2d'); pCtx.clearRect(0,0,120,120); pCtx.save();
                    const scale = (c==='lentxo') ? 2.1 : 2.3; pCtx.scale(scale, scale);
                    drawChar(pCtx, c, 8, 4, false, false, 0); pCtx.restore();
                }
            });
        }
        drawPortraits();

        function drawGymMachine(ctx, type, x, y, w, h) {
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.55)'; 
            ctx.fillRect(x + 8, y + 8, w, h); 
            
            ctx.fillStyle = '#1e1b2e'; ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, w, h);
            
            switch(type) {
                case 'bench':
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(x+10, y+10, w-20, h-20); 
                    ctx.fillStyle = '#dc2626'; ctx.fillRect(x+25, y+14, w-50, h-28); 
                    ctx.fillStyle = '#94a3b8'; ctx.fillRect(x+15, y+4, 8, h-8); ctx.fillRect(x+w-23, y+4, 8, h-8); 
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(x+8, y+22, w-16, 6); 
                    break;
                case 'treadmill':
                    ctx.fillStyle = '#020617'; ctx.fillRect(x+12, y+5, w-24, h-10); 
                    ctx.fillStyle = '#334155'; ctx.fillRect(x+18, y+10, w-36, h-20); 
                    ctx.fillStyle = '#ff9800'; ctx.fillRect(x+18, y+10, w-36, 3);
                    ctx.fillStyle = '#00f0ff'; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8;
                    ctx.fillRect(x+28, y+7, 26, 7);
                    break;
                case 'squat':
                    ctx.fillStyle = '#64748b'; ctx.fillRect(x+12, y+4, 10, h-8); ctx.fillRect(x+w-22, y+4, 10, h-8); 
                    ctx.fillStyle = '#dc2626'; ctx.fillRect(x+4, y+h-16, w-8, 9); 
                    ctx.fillStyle = '#fff'; ctx.fillRect(x+4, y+18, w-8, 6); 
                    break;
                case 'dumbbells':
                    ctx.fillStyle = '#334155'; ctx.fillRect(x+5, y+10, w-10, h-20); 
                    for(let i=0; i<4; i++) {
                        ctx.fillStyle = '#09090b'; ctx.beginPath(); ctx.arc(x+15 + i*20, y+16, 6.5, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#ff9800'; ctx.beginPath(); ctx.arc(x+15 + i*20, y+34, 8, 0, Math.PI*2); ctx.fill();
                    }
                    break;
                case 'pullup':
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(x+15, y+8, w-30, h-16); 
                    ctx.fillStyle = '#dc2626'; ctx.fillRect(x+14, y+8, 9, h-16); ctx.fillRect(x+w-23, y+8, 9, h-16); 
                    break;
                case 'legpress':
                    ctx.fillStyle = '#020617'; ctx.fillRect(x+10, y+10, w-20, h-20); 
                    ctx.fillStyle = '#dc2626'; ctx.fillRect(x+16, y+16, 24, 24);
                    break;
                case 'bag':
                    ctx.fillStyle = '#020617'; ctx.fillRect(x+25, y+4, w-50, h-8); 
                    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(x+w/2, y+h/2, 16, 0, Math.PI*2); ctx.fill(); 
                    break;
                case 'rowing':
                    ctx.fillStyle = '#334155'; ctx.fillRect(x+5, y+22, w-10, 9); 
                    ctx.fillStyle = '#dc2626'; ctx.fillRect(x+35, y+16, 22, 16); 
                    break;
                case 'bike':
                    ctx.fillStyle = '#00f0ff'; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 8;
                    ctx.beginPath(); ctx.arc(x+25, y+28, 14, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#09090b'; ctx.beginPath(); ctx.arc(x+25, y+28, 9, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3.5;
                    ctx.beginPath(); ctx.moveTo(x+25, y+28); ctx.lineTo(x+w-25, y+14); ctx.stroke();
                    break;
            }
            ctx.restore();
        }

        function drawTree(tx, ty) {
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(tx, ty + 32, 26, 9, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#3f2e21'; ctx.fillRect(tx - 8, ty, 16, 38); 
            ctx.fillStyle = '#15803d'; 
            ctx.beginPath(); ctx.arc(tx, ty - 12, 30, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#16a34a'; 
            ctx.beginPath(); ctx.arc(tx - 6, ty - 15, 16, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#4ade80'; 
            ctx.beginPath(); ctx.arc(tx + 8, ty - 18, 9, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawStreetlight(sx, sy) {
            ctx.save();
            ctx.fillStyle = '#0f172a'; ctx.fillRect(sx - 4, sy, 8, 48); 
            ctx.fillRect(sx - 18, sy - 5, 22, 6); 
            ctx.fillStyle = '#ffea00'; ctx.shadowColor = '#ffea00'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(sx - 12, sy - 2, 5, 0, Math.PI*2); ctx.fill(); 
            
            let lightGrad = ctx.createRadialGradient(sx - 12, sy + 25, 5, sx - 12, sy + 25, 50);
            lightGrad.addColorStop(0, 'rgba(255, 234, 0, 0.35)');
            lightGrad.addColorStop(1, 'rgba(255, 234, 0, 0)');
            ctx.fillStyle = lightGrad; ctx.beginPath(); ctx.arc(sx - 12, sy + 25, 50, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        // --- HIGH-QUALITY MAP DRAWING ---
        function draw() {
            ctx.save();
            if (screenShake > 0) {
                let rx = (Math.random() - 0.5) * screenShake;
                let ry = (Math.random() - 0.5) * screenShake;
                ctx.translate(rx, ry);
            }

            const displayW = canvas.logicalWidth;
            const displayH = canvas.logicalHeight;

            const maxXTile = isMobileLayout ? 600 : 640;
            const maxYTile = isMobileLayout ? 560 : 600;

            // --- MAP BACKGROUNDS ---
            if (currentChar === 'mane') {
                // ELEGANT NIGHTCLUB MAP
                ctx.fillStyle = '#0b021a'; // Deep Dark Purple Marble
                ctx.fillRect(0, 0, displayW, displayH);

                // Polished Floor Grid
                for(let i=0; i<maxXTile; i+=40) {
                    for(let j=0; j<maxYTile; j+=40) {
                        ctx.fillStyle = ((i/40 + j/40) % 2 === 0) ? '#12052b' : '#0a0218';
                        ctx.fillRect(i, j, 40, 40);
                        ctx.strokeStyle = 'rgba(157, 78, 221, 0.15)'; ctx.lineWidth = 1; 
                        ctx.strokeRect(i+0.5, j+0.5, 39, 39);
                    }
                }

                // DANCE FLOOR IN CENTER
                ctx.fillStyle = '#1c073a';
                ctx.fillRect(160, 140, 320, 280);
                ctx.strokeStyle = '#d800ff'; ctx.lineWidth = 2; ctx.shadowColor = '#d800ff'; ctx.shadowBlur = 15;
                ctx.strokeRect(160, 140, 320, 280); ctx.shadowBlur = 0;

                // Subtle Floor Spotlights (Atmospheric, not blinding)
                let spotlightGrad = ctx.createRadialGradient(320, 280, 20, 320, 280, 180);
                spotlightGrad.addColorStop(0, 'rgba(216, 0, 255, 0.25)');
                spotlightGrad.addColorStop(0.5, 'rgba(0, 240, 255, 0.12)');
                spotlightGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = spotlightGrad; ctx.fillRect(160, 140, 320, 280);

                // BAR COUNTER (TOP AREA)
                ctx.fillStyle = '#1e0836'; ctx.fillRect(40, 20, 560, 40); // Bar Table
                ctx.fillStyle = '#ff00ff'; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 10;
                ctx.fillRect(40, 58, 560, 4); ctx.shadowBlur = 0; // LED Strip

                // Glowing Liquors on Shelf
                const bottleColors = ['#ff0055', '#00ffff', '#ffea00', '#00ff88', '#d800ff'];
                for(let b=0; b<14; b++) {
                    ctx.fillStyle = bottleColors[b % bottleColors.length];
                    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 6;
                    ctx.fillRect(70 + b * 36, 6, 12, 14);
                    ctx.shadowBlur = 0;
                }

                // DJ BOOTH
                ctx.fillStyle = '#000000'; ctx.fillRect(260, 68, 120, 35);
                ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(260, 68, 120, 35);
                // Turntables & Mixer
                ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(285, 85, 10, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(355, 85, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#00ff88'; ctx.fillRect(315, 78, 10, 14);

                // SPEAKERS / SUBWOOFERS
                ctx.fillStyle = '#111118'; ctx.fillRect(180, 68, 40, 45); ctx.fillRect(420, 68, 40, 45);
                ctx.strokeStyle = '#ff007f'; ctx.strokeRect(180, 68, 40, 45); ctx.strokeRect(420, 68, 40, 45);
                ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(200, 80, 8, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(200, 98, 10, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(440, 80, 8, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(440, 98, 10, 0, Math.PI*2); ctx.fill();

                // CLUB NEON SIGN
                ctx.fillStyle = '#ff00ff'; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 18;
                ctx.font = "900 36px 'Orbitron', sans-serif"; ctx.textAlign = 'center';
                ctx.fillText('CLUB NEON', displayW / 2, 42); ctx.shadowBlur = 0;

            } else if (currentChar === 'lentxo') {
                // HIGH-END GYM MAP
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, displayW, displayH);
                
                // Gym Rubber Tiles
                for(let i=0; i<maxXTile; i+=40) {
                    for(let j=0; j<maxYTile; j+=40) {
                        ctx.fillStyle = ((i/40 + j/40) % 2 === 0) ? '#1e293b' : '#0f172a'; 
                        ctx.fillRect(i, j, 40, 40);
                        ctx.strokeStyle = '#334155'; ctx.lineWidth = 1; ctx.strokeRect(i+0.5, j+0.5, 39, 39);
                    }
                }
                // Running Track Lanes in Gym
                ctx.strokeStyle = 'rgba(255, 152, 0, 0.3)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(20, maxYTile); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(100, 0); ctx.lineTo(100, maxYTile); ctx.stroke();

                // MIRROR WALL AT TOP
                ctx.fillStyle = 'rgba(0, 240, 255, 0.15)'; ctx.fillRect(110, 5, 520, 25);
                ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 1.5; ctx.strokeRect(110, 5, 520, 25);
                ctx.fillStyle = '#00f0ff'; ctx.font = "900 14px 'Orbitron', sans-serif"; ctx.textAlign = 'center';
                ctx.fillText('POWER GYM - FITNESS CENTER', 370, 22);

            } else {
                // TECH MICROCHIP LAB MAP (ALPES)
                ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, displayW, displayH);
                for(let i=0; i<maxXTile; i+=40) {
                    for(let j=0; j<maxYTile; j+=40) {
                        ctx.fillStyle = ((i/40 + j/40) % 2 === 0) ? '#f8fafc' : '#e2e8f0';
                        ctx.fillRect(i, j, 40, 40);
                        ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; ctx.strokeRect(i + 0.5, j + 0.5, 39, 39);
                    }
                }

                // SERVER RACK CABINETS ALONG TOP
                for(let s=0; s<6; s++) {
                    let sx = 60 + s * 95;
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(sx, 5, 80, 30);
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1.5; ctx.strokeRect(sx, 5, 80, 30);
                    // Blinking Server LEDs
                    ctx.fillStyle = (Math.floor(Date.now() / 300 + s) % 2 === 0) ? '#00ff88' : '#00f0ff';
                    ctx.fillRect(sx + 10, 12, 6, 6);
                    ctx.fillStyle = (Math.floor(Date.now() / 200 + s) % 2 === 0) ? '#ffea00' : '#ff0055';
                    ctx.fillRect(sx + 22, 12, 6, 6);
                }
            }

            // Outdoor Zone
            ctx.fillStyle = '#05010d'; 
            ctx.fillRect(smokingZone.x, smokingZone.y, smokingZone.w, smokingZone.h);
            
            if (currentChar === 'mane') {
                if (isMobileLayout) {
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 600, 600, 100);
                    ctx.fillStyle = '#334155'; ctx.fillRect(0, 560, 600, 25);
                    drawStreetlight(120, 610); drawStreetlight(480, 610);
                } else {
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(680, 0, 120, 600);
                    ctx.fillStyle = '#334155'; ctx.fillRect(650, 0, 30, 600);
                    drawStreetlight(710, 120); drawStreetlight(710, 450);
                }
            } else {
                if (isMobileLayout) {
                    ctx.fillStyle = '#15803d'; ctx.fillRect(0, 560, 600, 140); 
                    ctx.fillStyle = '#78350f'; ctx.fillRect(240, 560, 120, 70); 
                    drawTree(100, 610); drawTree(500, 610);
                } else {
                    ctx.fillStyle = '#15803d'; ctx.fillRect(650, 0, 150, 600); 
                    ctx.fillStyle = '#78350f'; ctx.fillRect(650, 240, 80, 40); 
                    drawTree(735, 80); drawTree(745, 480); drawTree(690, 530);
                }
            }

            // Walls and Exit Door
            ctx.fillStyle = '#0f172a';
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.fillStyle = '#334155';
                if (isMobileLayout) {
                    for(let x=w.x; x<w.x+w.w; x+=20) ctx.fillRect(x, w.y, 2, w.h);
                } else {
                    for(let y=w.y; y<w.y+w.h; y+=20) ctx.fillRect(w.x, y, w.w, 2);
                }
                ctx.fillStyle = '#0f172a';
            });

            if (isMobileLayout) {
                ctx.fillStyle = '#dc2626'; ctx.fillRect(220, 540, 160, 20); 
                ctx.fillStyle = '#fff'; ctx.font = "900 16px 'Orbitron', sans-serif"; ctx.textAlign = 'center';
                ctx.fillText('SALIDA / EXIT', 300, 555);
            } else {
                ctx.fillStyle = '#dc2626'; ctx.fillRect(630, 240, 20, 120); 
                ctx.fillStyle = '#fff'; ctx.font = "900 18px 'Orbitron', sans-serif"; ctx.textAlign = 'center';
                ctx.fillText('E', 640, 265); ctx.fillText('X', 640, 290); ctx.fillText('I', 640, 315); ctx.fillText('T', 640, 340);
            }

            // Items
            if (itemObj.active) {
                ctx.save();
                ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 12;
                if (currentChar === 'alpes') {
                    ctx.fillStyle = '#c084fc'; 
                    ctx.beginPath(); ctx.arc(itemObj.x+12, itemObj.y+14, 11, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#22c55e'; ctx.fillRect(itemObj.x+11, itemObj.y-1, 3.5, 8);
                } else if (currentChar === 'lentxo') {
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(itemObj.x+7, itemObj.y+12, 7.5, Math.PI/2, Math.PI*1.5); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(itemObj.x+17, itemObj.y+12, 7.5, -Math.PI/2, Math.PI/2); ctx.fill();
                    ctx.fillRect(itemObj.x+7, itemObj.y+4.5, 10, 15);
                }
                ctx.restore();
            }

            // Desks / Gym / Persons
            desks.forEach((d, i) => {
                if (d.type === 'knocked_out') {
                    ctx.save(); ctx.translate(d.x + d.w/2, d.y + d.h/2); ctx.rotate(Math.PI / 2); 
                    ctx.globalAlpha = 0.65; drawChar(ctx, 'npc', -17, -22, false, false, 0); 
                    ctx.fillStyle = d.color; ctx.fillRect(-11, -6, 22, 26); 
                    ctx.fillStyle = '#ffeb3b'; ctx.font = '900 16px sans-serif'; ctx.textAlign = 'center'; 
                    ctx.fillText('💫', -6, -22);
                    ctx.restore();
                } else if (d.type === 'person') {
                    drawChar(ctx, 'npc', d.x, d.y, false, false, 0); 
                    ctx.fillStyle = d.color; ctx.fillRect(d.x + 5, d.y + 15, 24, 26); 
                } else if (d.type === 'desk') {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(d.x + 8, d.y + 8, d.w, d.h); 
                    ctx.fillStyle = '#1d4ed8'; ctx.fillRect(d.x, d.y, d.w, d.h);
                    ctx.fillStyle = '#1e40af'; ctx.fillRect(d.x + 2, d.y + 2, d.w - 4, 4);
                    
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(d.x + 10, d.y + 8, 46, 26); 
                    ctx.fillStyle = '#10b981'; ctx.shadowColor = '#10b981'; ctx.shadowBlur = 8;
                    ctx.fillRect(d.x + 12, d.y + 10, 42, 22); ctx.shadowBlur = 0;
                    
                    ctx.fillStyle = '#047857';
                    let lineOffset = (Date.now() / 100) % 15;
                    ctx.fillRect(d.x + 15, d.y + 12 + (lineOffset % 12), 22, 2);
                    ctx.fillRect(d.x + 15, d.y + 18 + ((lineOffset+5) % 12), 32, 2);

                    ctx.fillStyle = '#ef4444'; ctx.fillRect(d.x + 66, d.y + 16, 12, 14);
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(d.x + 68, d.y + 14, 8, 3);
                } else {
                    drawGymMachine(ctx, d.type, d.x, d.y, d.w, d.h);
                }

                if (i === activeDeskIndex && d.type !== 'knocked_out') {
                    let cx = d.x + d.w/2; let cy = d.y - 16;
                    
                    ctx.save();
                    ctx.strokeStyle = (Math.floor(Date.now() / 180) % 2 === 0) ? '#ff1744' : '#ffea00';
                    ctx.lineWidth = 3.5; ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 10;
                    ctx.strokeRect(d.x - 5, d.y - 5, d.w + 10, d.h + 10);
                    ctx.restore();

                    ctx.fillStyle = (Math.floor(Date.now() / 180) % 2 === 0) ? '#ff1744' : '#ffea00';
                    ctx.font = "900 34px 'Orbitron', sans-serif"; ctx.textAlign = 'center'; ctx.fillText('❗', cx, cy);

                    ctx.fillStyle = '#000'; ctx.fillRect(cx - 40, cy + 6, 80, 10);
                    let timePct = Math.max(0, taskTimeLeft / maxTaskTime);
                    ctx.fillStyle = timePct > 0.3 ? '#00f0ff' : '#ff1744'; ctx.fillRect(cx - 39, cy + 7, 78 * timePct, 8);

                    if (taskProgress > 0) {
                        ctx.fillStyle = '#000'; ctx.fillRect(cx - 40, d.y + d.h + 6, 80, 10);
                        ctx.fillStyle = '#ffea00'; ctx.fillRect(cx - 39, d.y + d.h + 7, 78 * (taskProgress/100), 8);
                    }
                }
            });

            drawChar(ctx, currentChar, player.x, player.y, interacting, relieving, urge);
            
            drawFX(ctx);
            ctx.restore();

            if (gameOver) {
                screens.canvas.style.display = 'none'; screens.ui.style.display = 'none';
                mobileControls.style.display = 'none';
                screens.gameover.style.display = 'flex';
                
                const d = DICT[currentLang];
                document.getElementById('go-reason').innerText = (failReason === 'TABACO') ? d.estallado : d.despedido;
                document.getElementById('go-score').innerText = d.scoreIs + score + " " + d[currentChar + '_score'];
            }
        }

        function loop(timestamp) {
            if (!gameOver) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.1) dt = 0.1;
                lastTime = timestamp;

                update(dt);
                draw();
                gameLoopId = requestAnimationFrame(loop);
            }
        }

        updateMenuText();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW ok:', reg.scope), err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
